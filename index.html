/* ================= RENTABILIDADE ================= */
function renderRentabilidade(){
  const rows = S.projects.map(p=>{
    const custos = S.transactions.filter(t=>t.type==='despesa' && t.projectId===p.id).reduce((s,t)=>s+(Number(t.value)||0),0);
    const contrato = Number(p.value)||0;
    const resultado = contrato-custos;
    const margem = contrato? (resultado/contrato*100) : 0;
    return {p, custos, contrato, resultado, margem};
  }).sort((a,b)=>b.margem-a.margem);
  return `
    <div class="page-head"><div><div class="page-eyebrow">Financeiro</div><h1 class="page-title serif">Rentabilidade por projeto</h1><p class="page-sub">Valor contratado menos custos relacionados, por projeto.</p></div></div>
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Projeto</th><th>Cliente</th><th>Contrato</th><th>Custos</th><th>Resultado</th><th>Margem</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr data-act="openProjectWorkspace" data-args='${JSON.stringify([r.p.id])}'>
          <td class="cell-primary">${escapeHtml(r.p.name)}</td>
          <td>${escapeHtml(clientName(r.p.clientId))}</td>
          <td>${fmtMoney(r.contrato)}</td>
          <td>${fmtMoney(r.custos)}</td>
          <td style="color:${r.resultado>=0?'var(--success)':'var(--danger)'}">${fmtMoney(r.resultado)}</td>
          <td><span class="badge ${r.margem>=50?'b-success':r.margem>=25?'b-info':r.margem>=0?'b-warning':'b-danger'}">${r.margem.toFixed(1)}%</span></td>
        </tr>`).join('')}
      </tbody>
    </table></div></div>
  `;
}

/* ================= RELATÓRIOS ================= */
function renderRelatorios(){
  const leadsTotal = S.leads.length;
  const wonStageIds = new Set(S.lead_stages.filter(s=>s.isWon).map(s=>s.id));
  const leadsContratados = S.leads.filter(l=>wonStageIds.has(l.stage)).length;
  const conversao = leadsTotal? (leadsContratados/leadsTotal*100).toFixed(1) : '0.0';
  const ticketMedio = leadsContratados? (S.leads.filter(l=>wonStageIds.has(l.stage)).reduce((s,l)=>s+(Number(l.budgetEstimate)||0),0)/leadsContratados) : 0;

  const projetosConcluidos = S.projects.filter(p=>p.status==='concluido');
  const prazoMedio = projetosConcluidos.length? Math.round(projetosConcluidos.reduce((s,p)=>{ const a=new Date(p.startDate+'T12:00:00'); const b=new Date(p.dueDate+'T12:00:00'); return s+Math.max(0,(b-a)/86400000); },0)/projetosConcluidos.length) : 0;

  const receitaTotal = S.transactions.filter(t=>t.type==='receita').reduce((s,t)=>s+(Number(t.value)||0),0);
  const despesaTotal = S.transactions.filter(t=>t.type==='despesa').reduce((s,t)=>s+(Number(t.value)||0),0);
  const receitasVencidas = S.transactions.filter(t=>t.type==='receita' && effectiveTxnStatus(t)==='atrasado');
  const inadimplencia = receitaTotal? (receitasVencidas.reduce((s,t)=>s+(Number(t.value)||0),0)/receitaTotal*100).toFixed(1) : '0.0';
  const rentabilidadeMedia = S.projects.length? (S.projects.reduce((s,p)=>{ const custos = S.transactions.filter(t=>t.type==='despesa'&&t.projectId===p.id).reduce((a,t)=>a+(Number(t.value)||0),0); const v = Number(p.value)||0; return s+(v? (v-custos)/v*100 : 0); },0)/S.projects.length).toFixed(1) : '0.0';

  const fornecedoresAtivos = S.suppliers.filter(s=>s.status==='ativo').length;

  return `
    <div class="page-head"><div><div class="page-eyebrow">Gestão</div><h1 class="page-title serif">Relatórios</h1><p class="page-sub">Panorama consolidado do escritório.</p></div></div>

    <div class="report-section">
      <div class="report-section-title">COMERCIAL</div>
      <div class="grid-4">
        <div class="card stat-card"><span class="stat-label">LEADS TOTAIS</span><div class="stat-value" style="font-size:24px;">${leadsTotal}</div></div>
        <div class="card stat-card"><span class="stat-label">TAXA DE CONVERSÃO</span><div class="stat-value" style="font-size:24px;">${conversao}%</div></div>
        <div class="card stat-card"><span class="stat-label">CONTRATOS FECHADOS</span><div class="stat-value" style="font-size:24px;">${leadsContratados}</div></div>
        <div class="card stat-card"><span class="stat-label">TICKET MÉDIO</span><div class="stat-value" style="font-size:20px;">${fmtMoney(ticketMedio)}</div></div>
      </div>
    </div>

    <div class="report-section">
      <div class="report-section-title">PROJETOS</div>
      <div class="grid-4">
        <div class="card stat-card"><span class="stat-label">ATIVOS</span><div class="stat-value" style="font-size:24px;">${S.projects.filter(p=>p.status!=='concluido').length}</div></div>
        <div class="card stat-card"><span class="stat-label">CONCLUÍDOS</span><div class="stat-value" style="font-size:24px;">${projetosConcluidos.length}</div></div>
        <div class="card stat-card"><span class="stat-label">ATRASADOS</span><div class="stat-value" style="font-size:24px;color:var(--danger);">${S.projects.filter(p=>p.status==='atrasado').length}</div></div>
        <div class="card stat-card"><span class="stat-label">PRAZO MÉDIO (CONCLUÍDOS)</span><div class="stat-value" style="font-size:20px;">${prazoMedio} dias</div></div>
      </div>
    </div>

    <div class="report-section">
      <div class="report-section-title">FINANCEIRO</div>
      <div class="grid-4">
        <div class="card stat-card"><span class="stat-label">RECEITA TOTAL</span><div class="stat-value" style="font-size:20px;">${fmtMoney(receitaTotal)}</div></div>
        <div class="card stat-card"><span class="stat-label">DESPESA TOTAL</span><div class="stat-value" style="font-size:20px;">${fmtMoney(despesaTotal)}</div></div>
        <div class="card stat-card"><span class="stat-label">RENTABILIDADE MÉDIA</span><div class="stat-value" style="font-size:24px;">${rentabilidadeMedia}%</div></div>
        <div class="card stat-card"><span class="stat-label">INADIMPLÊNCIA</span><div class="stat-value" style="font-size:24px;color:${Number(inadimplencia)>10?'var(--danger)':'var(--ink)'}">${inadimplencia}%</div></div>
      </div>
    </div>

    <div class="report-section">
      <div class="report-section-title">OBRAS</div>
      <div class="grid-4">
        <div class="card stat-card"><span class="stat-label">OBRAS ATIVAS</span><div class="stat-value" style="font-size:24px;">${S.sites.filter(s=>s.status!=='concluida').length}</div></div>
        <div class="card stat-card"><span class="stat-label">ATRASADAS</span><div class="stat-value" style="font-size:24px;color:var(--danger);">${S.sites.filter(s=>s.status==='atrasada').length}</div></div>
        <div class="card stat-card"><span class="stat-label">PENDÊNCIAS ABERTAS</span><div class="stat-value" style="font-size:24px;">${S.issues.filter(i=>i.status!=='concluido').length}</div></div>
        <div class="card stat-card"><span class="stat-label">FORNECEDORES ATIVOS</span><div class="stat-value" style="font-size:24px;">${fornecedoresAtivos}</div></div>
      </div>
    </div>
  `;
}

/* ================= AGENDA ================= */
const EVENT_TYPES = {
  reuniao:{label:'Reunião', color:'var(--info)'},
  visita:{label:'Visita à obra', color:'var(--accent)'},
  entrega:{label:'Entrega', color:'var(--success)'},
  apresentacao:{label:'Apresentação', color:'#8B5CF6'},
  fornecedor:{label:'Reunião com fornecedor', color:'var(--warning)'},
  vencimento:{label:'Vencimento', color:'var(--danger)'},
};
function agendaItemsForDate(dateStr){
  const items = [];
  S.events.filter(e=>e.date===dateStr).forEach(e=>items.push({kind:'event', time:e.time||'', title:e.title, sub:EVENT_TYPES[e.type]?.label||e.type, color:EVENT_TYPES[e.type]?.color||'var(--ink-faint)', ref:e, done:e.status==='concluido'}));
  // Tarefas concluídas continuam aparecendo na agenda (nunca somem) — só
  // ficam visualmente discretas (riscadas), tratadas na renderização abaixo.
  S.tasks.filter(t=>t.dueDate===dateStr).forEach(t=>items.push({kind:'task', time:'', title:t.title, sub:'Prazo de tarefa · '+projectName(t.projectId), color:'var(--info)', ref:t, done:t.status==='concluido'}));
  S.projects.filter(p=>p.dueDate===dateStr).forEach(p=>items.push({kind:'project', time:'', title:'Entrega: '+p.name, sub:'Projeto', color:'var(--accent)', ref:p}));
  S.transactions.filter(t=>t.dueDate===dateStr).forEach(t=>items.push({kind:'txn', time:'', title:(t.type==='receita'?'Recebimento: ':'Pagamento: ')+t.description, sub:fmtMoney(t.value), color:t.type==='receita'?'var(--success)':'var(--danger)', ref:t}));
  S.sites.filter(s=>s.dueDate===dateStr).forEach(s=>items.push({kind:'site', time:'', title:'Previsão de término: '+s.name, sub:'Obra', color:'var(--warning)', ref:s}));
  items.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  return items;
}
function renderAgenda(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth()+S.calendarOffset);
  const year = base.getFullYear(), month = base.getMonth();
  const firstDow = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const prevDays = new Date(year,month,0).getDate();
  const cells = [];
  for(let i=firstDow-1;i>=0;i--) cells.push({day:prevDays-i, outside:true, dateStr:null});
  for(let d=1;d<=daysInMonth;d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({day:d, outside:false, dateStr});
  }
  while(cells.length%7!==0) cells.push({day:cells.length, outside:true, dateStr:null});

  const monthLabelStr = base.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  const todayStr = todayISO();
  const selected = S.calendarSelected || todayStr;
  const selItems = agendaItemsForDate(selected);

  return `
    <div class="page-head">
      <div><div class="page-eyebrow">Principal</div><h1 class="page-title serif">Agenda</h1><p class="page-sub">Reuniões, visitas, entregas e vencimentos do escritório.</p></div>
      <div class="page-actions"><button class="btn btn-primary" data-act="openEventForm" data-args='${JSON.stringify([null, selected])}'>${ICONS.plus} Novo evento</button></div>
    </div>
    <div class="grid-2">
      <div class="card card-pad">
        <div class="cal-head">
          <div class="cal-month-label">${monthLabelStr[0].toUpperCase()+monthLabelStr.slice(1)}</div>
          <div class="cal-nav">
            <button data-act="calendarPrev">‹</button>
            <button data-act="calendarToday" style="width:auto;padding:0 10px;font-size:11.5px;">Hoje</button>
            <button data-act="calendarNext">›</button>
          </div>
        </div>
        <div class="cal-grid">
          ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${cells.map(c=>{
            if(c.outside) return `<div class="cal-cell outside"><div class="cal-daynum">${c.day}</div></div>`;
            const items = agendaItemsForDate(c.dateStr);
            const isToday = c.dateStr===todayStr;
            const isSel = c.dateStr===selected;
            return `<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''}" data-act="calendarSelectDay" data-args='${JSON.stringify([c.dateStr])}'>
              <div class="cal-daynum">${c.day}</div>
              <div class="cal-dots">${items.slice(0,4).map(it=>`<span class="cal-dot" style="background:${it.color}"></span>`).join('')}</div>
              ${items.length>4? `<div class="cal-more">+${items.length-4}</div>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="card card-pad">
        <div class="section-head"><h3 class="section-title">${fmtDateLong(selected)}</h3></div>
        ${selItems.length? selItems.map(it=>`
          <div class="stat-row" style="cursor:pointer;align-items:flex-start;padding:10px 0;${it.done?'opacity:.55;':''}" data-act="openAgendaItemDrawer" data-args='${JSON.stringify([it.kind, it.ref.id])}'>
            <span><span class="cal-dot" style="background:${it.color};display:inline-block;margin-right:8px;"></span><span style="${it.done?'text-decoration:line-through;':''}">${it.time? it.time+' · ':''}${escapeHtml(it.title)}</span><div class="mini-tag" style="margin-left:16px;">${escapeHtml(it.sub)}</div></span>
          </div>
        `).join('') : `<p class="mini-tag">Nada agendado neste dia.</p>`}
      </div>
    </div>
  `;
}

      ${e.projectId? `<div class="dr-field"><div class="dr-label">PROJETO</div><div class="dr-value" style="cursor:pointer;color:var(--accent);" data-act="openProjectWorkspace" data-args='${JSON.stringify([e.projectId])}'>${escapeHtml(projectName(e.projectId))}</div></div>`:''}
      ${e.notes? `<div class="dr-field"><div class="dr-label">OBSERVAÇÕES</div><div class="dr-value">${escapeHtml(e.notes)}</div></div>`:''}
      <div style="margin-top:24px;"><button class="btn btn-danger-text btn-sm" data-act="confirmDeleteEntity" data-args='${JSON.stringify(['events', id, 'evento'])}'>${ICONS.trash} Excluir evento</button></div>

async function toggleEventStatus(id){
  const e = S.events.find(x=>x.id===id); if(!e) return;
  const newStatus = e.status==='concluido'? 'pendente' : 'concluido';
  await dbSet('events', id, {status:newStatus});
  toast(newStatus==='concluido'? 'Evento marcado como concluído.' : 'Evento reaberto como pendente.');
  if(!S.dbAvailable) render();
}

function readAndCompressImage(file, maxDim, quality){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const rawDataUrl = e.target.result;
      let settled = false;
      const finish = (val)=>{ if(!settled){ settled = true; resolve(val); } };
      const fallbackTimer = setTimeout(()=>finish(rawDataUrl), 1500);
      try{
        const img = new Image();
        img.onload = function(){
          clearTimeout(fallbackTimer);
          if(!img.width || !img.height){ finish(rawDataUrl); return; }
          let w = img.width, h = img.height;
          if(w>maxDim || h>maxDim){
            if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
          }
          try{
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            finish(canvas.toDataURL('image/jpeg', quality));
          }catch(err){ finish(rawDataUrl); }
        };
        img.onerror = function(){ clearTimeout(fallbackTimer); finish(rawDataUrl); };
        img.src = rawDataUrl;
      }catch(err){ clearTimeout(fallbackTimer); finish(rawDataUrl); }
    };
    reader.onerror = function(){ resolve(null); };
    reader.readAsDataURL(file);
  });
}

const STORAGE_BUCKET = 'files';
function guessFileTypeLabel(file){
  const ext = (file.name.split('.').pop()||'').toUpperCase();
  return ext || (file.type? file.type.split('/')[1].toUpperCase() : 'ARQUIVO');
}
function isBucketMissingError(error){
  const msg = (error && error.message || '').toLowerCase();
  return msg.includes('bucket not found') || msg.includes('bucket_not_found') || (error && error.statusCode==='404' && msg.includes('bucket'));
}
function storageErrorMessage(error){
  if(isBucketMissingError(error)) return `Bucket "${STORAGE_BUCKET}" não encontrado. Crie o bucket privado "${STORAGE_BUCKET}" no Supabase Storage.`;
  // Nunca mascara com mensagem genérica — mostra a mensagem real do Supabase.
  return (error && error.message) ? `Falha ao enviar o arquivo: ${error.message}` : 'Falha ao enviar o arquivo.';
}
// Caminho organizado por usuário — <auth.uid()>/<uuid>-<nome-do-arquivo> —
// usado por todo lugar que envia arquivo real ao bucket "files".
async function uploadFileToStorageBucket(file){
  const client = getSupabaseClient();
  if(!client) throw new Error('Supabase não está configurado.');
  const ownerId = await getCurrentOwnerId();
  const path = `${ownerId}/${uid('f')}-${file.name}`;
  const { error } = await client.storage.from(STORAGE_BUCKET).upload(path, file);
  if(error) throw error;
  return path;
}
async function removeFromStorageBucket(path){
  const client = getSupabaseClient();
  if(!client || !path) return;
  try{ await client.storage.from(STORAGE_BUCKET).remove([path]); }
  catch(e){ console.warn('[Storage] Falha ao remover arquivo do Storage:', e); }
}
async function openSignedFileUrl(storagePath, downloadFilename){
  if(!storagePath){ toast('Este arquivo foi cadastrado só como registro (sem upload real) — nada para abrir.'); return; }
  const client = getSupabaseClient();
  if(!client){ toast('Supabase não está configurado.'); return; }
  try{
    // Sem downloadFilename: link "de visualização", o navegador decide como
    // mostrar (imagem/PDF abrem inline). Com downloadFilename: o Storage
    // devolve o link já marcado para forçar o download, preservando o nome
    // original do arquivo (parâmetro nativo do Supabase — não precisa de
    // nenhuma lógica extra nossa nem de mudança de política).
    const opts = downloadFilename? {download:downloadFilename} : undefined;
    const { data, error } = await client.storage.from(STORAGE_BUCKET).createSignedUrl(storagePath, 60, opts);
    if(error) throw error;
    window.open(data.signedUrl, '_blank');
  }catch(e){
    console.error('[Storage] Falha ao gerar link do arquivo:', e);
    toast(storageErrorMessage(e));
  }
}
const VIEWABLE_FILE_TYPES = new Set(['JPG','JPEG','PNG','GIF','WEBP','SVG','PDF']);
function isViewableFileType(type){ return VIEWABLE_FILE_TYPES.has((type||'').toUpperCase()); }

async function handleStageFilesSelected(stageId, files){
  if(!files || !files.length) return;
  const stage = S.stages.find(s=>s.id===stageId);
  const projectId = stage? stage.projectId : null;
  if(S.dataBackend!=='supabase'){
    // Sem Supabase real (modo local/teste): mantém o comportamento anterior,
    // só o catálogo de metadados — não existe Storage equivalente no modo Claude.
    for(const file of Array.from(files)){
      await dbAdd('stage_files', { stageId, projectId, name:file.name, type:guessFileTypeLabel(file), version:'v1', date: todayISO(), fileSize:file.size });
    }
    toast('Arquivo registrado (modo local — sem upload real).');
    if(!S.dbAvailable) render();
    return;
  }
  let added = 0;
  for(const file of Array.from(files)){
    let uploadedPath = null;
    try{
      uploadedPath = await uploadFileToStorageBucket(file);
      // Só cria o registro DEPOIS do upload ter sucesso — nunca um registro órfão.
      try{
        await dbAdd('stage_files', {
          stageId, projectId, name:file.name, type:guessFileTypeLabel(file), version:'v1', date: todayISO(),
          fileSize:file.size, storagePath:uploadedPath,
        });
        added++;
      }catch(dbErr){
        // O upload foi bem-sucedido mas o registro no banco falhou — remove o
        // arquivo recém-enviado do Storage para não deixar lixo órfão lá.
        await removeFromStorageBucket(uploadedPath);
        throw dbErr;
      }
    }catch(e){
      console.error('[Storage] Falha ao enviar arquivo:', e);
      toast(storageErrorMessage(e));
    }
  }
  if(added){
    await logActivity(`${added>1? added+' arquivos adicionados' : 'Arquivo adicionado'}${stage? ' — '+stage.name : ''}.`, 'file');
    toast(added>1? `${added} arquivos enviados.` : 'Arquivo enviado.');
  }
}

function fmtFileSize(bytes){
  if(!bytes) return '';
  if(bytes<1024) return bytes+' B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(0)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}

async function createProjectStagesFromTemplate(projectId, templateId, startDate){
  const tStages = S.template_stages.filter(t=>t.templateId===templateId).sort((a,b)=>a.order-b.order);
  let cursor = startDate || todayISO();
  let chainBroken = false;
  for(const ts of tStages){
    const data = {
      projectId, key:null, order:ts.order, name:ts.name,
      status:'nao_iniciado', completedAt:null, completedBy:null,
      notes: ts.notes || '',
    };
    if(!chainBroken){
      data.startDate = cursor;
      if(ts.offsetDays!=null){
        data.dueDate = addBusinessDays(cursor, ts.offsetDays);
        cursor = data.dueDate;
      } else {
        data.dueDate = null;
        chainBroken = true;
      }
    } else {
      data.startDate = null; data.dueDate = null;
    }
    const newStageId = await dbAdd('stages', data);

    const tChecklist = S.template_checklist_items.filter(c=>c.templateStageId===ts.id);
    for(const tc of tChecklist){
      await dbAdd('checklist_items', {
        stageId:newStageId, projectId, title:tc.title, description:'', responsible:'',
        dueDate: (tc.offsetDays!=null && data.startDate)? addBusinessDays(data.startDate, tc.offsetDays) : null,
        status:'pendente', completedAt:null,
      });
    }
    const tFiles = S.template_files.filter(f=>f.templateStageId===ts.id);
    for(const tf of tFiles){
      await dbAdd('stage_files', { stageId:newStageId, projectId, name:tf.name, type:tf.type, version:'v1', date:todayISO(), fromTemplate:true });
    }
  }
}

async function moveTemplateSiteChecklistItem(id, direction){
  const item = S.template_site_checklist_items.find(x=>x.id===id); if(!item) return;
  const siblings = S.template_site_checklist_items.filter(c=>c.templateId===item.templateId).sort((a,b)=>a.order-b.order);
  const idx = siblings.findIndex(c=>c.id===id);
  const swapIdx = idx+direction;
  if(swapIdx<0 || swapIdx>=siblings.length) return;
  const a = siblings[idx], b = siblings[swapIdx];
  await dbSet('template_site_checklist_items', a.id, {order:b.order});
  await dbSet('template_site_checklist_items', b.id, {order:a.order});
  if(!S.dbAvailable) render();
}

/* ================= TEMPO E PRODUTIVIDADE ================= */
function setProdFilter(field, value){ S.productivityFilters[field] = value; rerenderCurrentView(); }
function filteredTimeEntries(){
  const f = S.productivityFilters;
  return S.time_entries.filter(e=>{
    if(f.projectId && e.projectId!==f.projectId) return false;
    if(f.activityType && e.activityType!==f.activityType) return false;
    if(f.responsible && e.responsible!==f.responsible) return false;
    if(f.templateId){
      const proj = S.projects.find(p=>p.id===e.projectId);
      if(!proj || proj.templateId!==f.templateId) return false;
    }
    if(f.stageName){
      const stage = S.stages.find(s=>s.id===e.stageId);
      if(!stage || stage.name!==f.stageName) return false;
    }
    if(f.period){
      const d = e.date || (e.startedAt? e.startedAt.slice(0,10):null);
      if(!d) return false;
      const days = Number(f.period);
      const diff = daysUntil(d);
      if(diff===null || diff < -days) return false;
    }
    return true;
  });
}
function itemFor(kind, itemId){ return kind==='task'? S.tasks.find(t=>t.id===itemId) : S.checklist_items.find(c=>c.id===itemId); }
function timeByProject(entries){
  const map = {};
  entries.forEach(e=>{ if(!e.projectId) return; map[e.projectId] = (map[e.projectId]||0) + entrySeconds(e); });
  return Object.entries(map).map(([projectId, totalSeconds])=>({projectId, totalSeconds})).sort((a,b)=>b.totalSeconds-a.totalSeconds);
}
function timeByStageForProject(entries, projectId){
  const stages = S.stages.filter(s=>s.projectId===projectId).sort((a,b)=>a.order-b.order);
  return stages.map(s=>({stage:s, totalSeconds: entries.filter(e=>e.stageId===s.id).reduce((a,e)=>a+entrySeconds(e),0)}));
}
function averagesByGroup(entries, keyFn){
  const byKey = {};
  entries.forEach(e=>{
    const key = keyFn(e);
    if(!key) return;
    const item = itemFor(e.kind, e.itemId);
    if(!item || item.status!=='concluido') return; // regra: só tarefas concluídas com tempo e tipo entram na média
    const itemKey = e.kind+'_'+e.itemId;
    byKey[key] = byKey[key] || {};
    byKey[key][itemKey] = (byKey[key][itemKey]||0) + entrySeconds(e);
  });
  return Object.entries(byKey).map(([key, itemsMap])=>{
    const totals = Object.values(itemsMap);
    const totalSeconds = totals.reduce((a,b)=>a+b,0);
    return {key, count: totals.length, totalSeconds, avgSeconds: totals.length? totalSeconds/totals.length : 0};
  }).sort((a,b)=>b.totalSeconds-a.totalSeconds);
}
function renderProdutividade(){
  const f = S.productivityFilters;
  const entries = filteredTimeEntries();
  const now = new Date();
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate()-now.getDay()); startOfWeek.setHours(0,0,0,0);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const todayStr = todayISO();
  let today=0, week=0, month=0;
  S.time_entries.forEach(e=>{
    const d = e.date || (e.startedAt? e.startedAt.slice(0,10) : null);
    if(!d) return;
    const secs = entrySeconds(e);
    if(d===todayStr) today += secs;
    const dDate = new Date(d+'T12:00:00');
    if(dDate>=startOfWeek) week += secs;
    if(dDate>=startOfMonth) month += secs;
  });

  const byProject = timeByProject(entries);
  const byActivityType = averagesByGroup(entries, e=>e.activityType||null);
  const byStageName = averagesByGroup(entries, e=>{ const s=S.stages.find(x=>x.id===e.stageId); return s? s.name : null; });

  const responsibles = [...new Set(S.time_entries.map(e=>e.responsible).filter(Boolean))];
  const stageNames = [...new Set(S.stages.map(s=>s.name))];

  return `
    <div class="page-head">
      <div><div class="page-eyebrow">Gestão</div><h1 class="page-title serif">Tempo e produtividade</h1><p class="page-sub">Indicadores construídos a partir dos registros reais de tempo — sem estimativas.</p></div>
    </div>

    <div class="grid-4">
      <div class="card stat-card"><span class="stat-label">TEMPO HOJE</span><div class="stat-value" style="font-size:22px;">${formatDurationShort(today)||'0min'}</div></div>
      <div class="card stat-card"><span class="stat-label">ESTA SEMANA</span><div class="stat-value" style="font-size:22px;">${formatDurationShort(week)||'0min'}</div></div>
      <div class="card stat-card"><span class="stat-label">ESTE MÊS</span><div class="stat-value" style="font-size:22px;">${formatDurationShort(month)||'0min'}</div></div>
      <div class="card stat-card"><span class="stat-label">REGISTROS DE TEMPO</span><div class="stat-value" style="font-size:22px;">${S.time_entries.length}</div></div>
    </div>

    <div class="toolbar" style="margin-top:22px;">
      <select class="filter-select" data-change-act="setProdFilter" data-args='${JSON.stringify(['period'])}'>
        <option value="">Todo o período</option>
        <option value="7" ${f.period==='7'?'selected':''}>Últimos 7 dias</option>
        <option value="30" ${f.period==='30'?'selected':''}>Últimos 30 dias</option>
        <option value="90" ${f.period==='90'?'selected':''}>Últimos 90 dias</option>
      </select>
      <select class="filter-select" data-change-act="setProdFilter" data-args='${JSON.stringify(['projectId'])}'>
        <option value="">Todos os projetos</option>
        ${S.projects.map(p=>`<option value="${p.id}" ${f.projectId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
      </select>
      <select class="filter-select" data-change-act="setProdFilter" data-args='${JSON.stringify(['templateId'])}'>
        <option value="">Todas as classificações</option>
        ${S.project_templates.map(t=>`<option value="${t.id}" ${f.templateId===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}
      </select>
      <select class="filter-select" data-change-act="setProdFilter" data-args='${JSON.stringify(['stageName'])}'>
        <option value="">Todas as etapas</option>
        ${stageNames.map(n=>`<option value="${escapeHtml(n)}" ${f.stageName===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
      </select>
      <select class="filter-select" data-change-act="setProdFilter" data-args='${JSON.stringify(['activityType'])}'>
        <option value="">Todos os tipos</option>
        ${S.activity_types.map(a=>`<option value="${escapeHtml(a.name)}" ${f.activityType===a.name?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}
      </select>
      <select class="filter-select" data-change-act="setProdFilter" data-args='${JSON.stringify(['responsible'])}'>
        <option value="">Todos os responsáveis</option>
        ${responsibles.map(r=>`<option value="${escapeHtml(r)}" ${f.responsible===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
      </select>
    </div>

    <div class="grid-2 section-block">
      <div class="card card-pad">
        <div class="section-head"><h3 class="section-title">Tempo por projeto</h3></div>
        ${byProject.length? byProject.map(p=>`
          <div class="stat-row" data-act="openProjectWorkspace" data-args='${JSON.stringify([p.projectId])}'><span>${escapeHtml(projectName(p.projectId))}</span><b>${formatDurationShort(p.totalSeconds)}</b></div>
        `).join('') : '<p class="mini-tag">Nenhum tempo registrado no filtro atual.</p>'}
      </div>
      <div class="card card-pad">
        <div class="section-head"><h3 class="section-title">Tempo por etapa${f.projectId? '' : ' (selecione um projeto)'}</h3></div>
        ${f.projectId? timeByStageForProject(entries, f.projectId).map(s=>`
          <div class="stat-row" data-act="openStageInline" data-args='${JSON.stringify([s.stage.id])}'><span>${s.stage.order}ª — ${escapeHtml(s.stage.name)}</span><b>${formatDurationShort(s.totalSeconds)}</b></div>
        `).join('') : '<p class="mini-tag">Filtre por um projeto específico para ver o tempo por etapa.</p>'}
      </div>
    </div>

    <div class="grid-2 section-block">
      <div class="card card-pad">
        <div class="section-head"><h3 class="section-title">Média de tempo por tipo de atividade</h3></div>
        <p class="mini-tag" style="margin-top:0;">Considera apenas itens concluídos, com tempo e tipo registrados.</p>
        ${byActivityType.length? byActivityType.map(g=>`
          <div class="stat-row"><span>${escapeHtml(g.key)} <span class="mini-tag">(${g.count} item${g.count===1?'':'s'})</span></span><b>${formatDurationShort(g.avgSeconds)}/item</b></div>
        `).join('') : '<p class="mini-tag">Ainda não há dados suficientes (itens concluídos, com tempo e tipo registrados).</p>'}
      </div>
      <div class="card card-pad">
        <div class="section-head"><h3 class="section-title">Média de tempo por etapa</h3></div>
        <p class="mini-tag" style="margin-top:0;">Considera apenas itens concluídos, agrupados por nome da etapa entre projetos.</p>
        ${byStageName.length? byStageName.map(g=>`
          <div class="stat-row"><span>${escapeHtml(g.key)} <span class="mini-tag">(${g.count} item${g.count===1?'':'s'})</span></span><b>${formatDurationShort(g.avgSeconds)}/item</b></div>
        `).join('') : '<p class="mini-tag">Ainda não há dados suficientes.</p>'}
      </div>
    </div>

    <div class="section-block card card-pad">
      <div class="section-head"><h3 class="section-title">Comparação entre projetos</h3></div>
      ${(() => {
        const rows = S.projects.map(p=>{
          const pEntries = S.time_entries.filter(e=>e.projectId===p.id);
          const totalSeconds = pEntries.reduce((s,e)=>s+entrySeconds(e),0);
          const distinctItems = new Set(pEntries.map(e=>e.kind+'_'+e.itemId));
          const taskCount = distinctItems.size;
          const avg = taskCount? totalSeconds/taskCount : 0;
          const valorHora = (totalSeconds>0 && p.value)? (Number(p.value)/(totalSeconds/3600)) : null;
          return {p, totalSeconds, taskCount, avg, valorHora};
        }).filter(r=>r.totalSeconds>0).sort((a,b)=>b.totalSeconds-a.totalSeconds);
        if(!rows.length) return '<p class="mini-tag">Nenhum projeto com tempo registrado ainda.</p>';
        return `<div class="table-wrap"><table>

async function saveTemplate(id){
  const name = val('f_name');
  if(!name){ toast('Informe o nome da classificação.'); return; }
  const data = {name, description: val('f_desc')};
  if(id){
    await dbSet('project_templates', id, data);
    await logActivity(`Classificação "${name}" atualizada.`,'project');
  } else {
    const newId = await dbAdd('project_templates', data);
    // Toda classificação nova já nasce com as 8 etapas padrão do processo —
    // a arquiteta ajusta a partir daí (adiciona, remove, edita prazos e conteúdo).
    for(const def of STAGE_DEFINITIONS){
      await dbAdd('template_stages', { templateId:newId, order:def.order, name:def.name, offsetDays: def.offsetDays!=null? def.offsetDays : null, notes:'' });

    await logActivity(`Nova classificação de projetos: ${name} — ${STAGE_DEFINITIONS.length} etapas padrão pré-carregadas.`,'project');
  }
  closeModal(); toast('Classificação salva.'); if(!S.dbAvailable) render();

async function moveLeadStage(id, direction){
  const stages = leadStagesSorted();
  const idx = stages.findIndex(s=>s.id===id);
  const swapIdx = idx+direction;
  if(swapIdx<0 || swapIdx>=stages.length) return;
  const a = stages[idx], b = stages[swapIdx];
  await dbSet('lead_stages', a.id, {order:b.order});
  await dbSet('lead_stages', b.id, {order:a.order});
  if(!S.dbAvailable) render();
}
function convertLeadToClient(leadId){
  const l = S.leads.find(x=>x.id===leadId); if(!l) return;
  if(l.convertedClientId){ toast('Este lead já foi convertido.'); return; }
  showConfirmModal({
    title: 'Converter em cliente',
    message: `Converter "${escapeHtml(l.name)}" em cliente? O histórico e as tarefas do lead serão preservados.`,
    confirmLabel: 'Converter',
    onConfirm: async () => {
      const clientId = await dbAdd('clients', {
        name:l.name, phone:l.phone||'', whatsapp:l.whatsapp||'', email:l.email||'',
        cpfCnpj:'', address:'', company:'', role:'',
        notes: `Convertido a partir do lead (origem: ${l.source||'—'}).${l.notes? ' '+l.notes : ''}`,
      });
      const leadTasks = S.tasks.filter(t=>t.leadId===leadId);
      for(const t of leadTasks){ await dbSet('tasks', t.id, {clientId}); }
      await dbSet('leads', leadId, {convertedClientId:clientId, convertedAt:todayISO()});
      await logActivity(`Lead "${l.name}" convertido em cliente.`, 'client');
      toast('Lead convertido em cliente.');
      openDrawer('client', clientId);
    },
  });
}

let _confirmCallback = null;
function showConfirmModal(opts){
  _confirmCallback = opts.onConfirm;
  showModal(`
    <div class="overlay" data-act="closeModal" data-self-only="1">
      <div class="modal" style="max-width:420px;">
        <div class="modal-head"><h3>${opts.title}</h3><button class="icon-btn" data-act="closeModal">${ICONS.x}</button></div>
        <div class="modal-body"><p style="margin:0;line-height:1.6;">${opts.message}</p></div>
        <div class="modal-foot"><span></span>
          <div style="display:flex;gap:8px;">
            <button class="btn" data-act="closeModal">${opts.cancelLabel||'Cancelar'}</button>
            <button class="btn ${opts.danger?'btn-danger':'btn-primary'}" data-act="runConfirmCallback">${opts.confirmLabel||'Confirmar'}</button>
          </div>
        </div>
      </div>
    </div>
  `);
}
function runConfirmCallback(){
  const cb = _confirmCallback;
  _confirmCallback = null;
  closeModal();
  if(cb) cb();
}
function confirmDeleteEntity(col, id, label){
  showConfirmModal({
    title: 'Excluir ' + label,
    message: `Excluir este ${escapeHtml(label)}? Essa ação não pode ser desfeita.`,
    confirmLabel: 'Excluir',
    danger: true,
    onConfirm: () => {
      dbDelete(col, id);
      closeDrawer();
      toast(`${label[0].toUpperCase()+label.slice(1)} excluído.`);
    },
  });
}

/* ---- Etapas: criação automática, recálculo de progresso e ações ---- */
/* ---- Dias úteis: motor de cálculo usado tanto pelo fluxo padrão quanto pelos templates ---- */
function addBusinessDays(dateISO, days){
  if(days==null) return null;
  let d = new Date(dateISO+'T12:00:00');
  const step = days>=0? 1 : -1;
  let remaining = Math.abs(days);
  while(remaining>0){
    d.setDate(d.getDate()+step);
    const dow = d.getDay();
    if(dow!==0 && dow!==6) remaining--;
  }
  return d.toISOString().slice(0,10);
}
async function createProjectStages(projectId, startDate){
  let cursor = startDate || todayISO();
  let chainBroken = false;
  for(const def of STAGE_DEFINITIONS){
    const data = {
      projectId, key:def.key, order:def.order, name:def.name,
      status:'nao_iniciado', completedAt:null, completedBy:null,
    };
    if(def.hasChangeLimit) data.changesUsed = 0;
    if(!chainBroken){
      data.startDate = cursor;
      if(def.offsetDays!=null){
        data.dueDate = addBusinessDays(cursor, def.offsetDays);
        cursor = data.dueDate;
      } else {
        data.dueDate = null;
        chainBroken = true; // prazo depende de aprovação/demanda — não dá para encadear as próximas automaticamente
      }
    } else {
      data.startDate = null; data.dueDate = null;
    }
    await dbAdd('stages', data);
  }
}
async function recalcProjectProgress(projectId){
  const stages = S.stages.filter(s=>s.projectId===projectId);
  if(!stages.length) return;
  const done = stages.filter(s=>s.status==='concluido').length;
  const pct = Math.round(done/stages.length*100);
  await dbSet('projects', projectId, {progress: pct});
}
async function completeStage(id){
  const st = S.stages.find(x=>x.id===id); if(!st) return;
  await dbSet('stages', id, {status:'concluido', completedAt:todayISO(), completedBy:'Vanessa'});
  await recalcProjectProgress(st.projectId);
  const proj = S.projects.find(p=>p.id===st.projectId);
  await logActivity(`Etapa "${st.name}" concluída${proj? ' — '+proj.name : ''}.`, 'project');
  toast('Etapa marcada como concluída.');
  closeDrawer();
}
async function changeStageStatus(id, status){
  const st = S.stages.find(x=>x.id===id); if(!st) return;
  const data = {status};
  if(status==='concluido'){ data.completedAt = todayISO(); data.completedBy = 'Vanessa'; }
  else if(st.status==='concluido'){ data.completedAt = null; data.completedBy = null; }
  await dbSet('stages', id, data);
  await recalcProjectProgress(st.projectId);
}
async function registerStageChange(id){
  const st = S.stages.find(x=>x.id===id); if(!st) return;
  const def = STAGE_DEFINITIONS.find(d=>d.key===st.key);
  const max = (def && def.maxChanges) || 3;
  const used = st.changesUsed||0;
  if(used>=max){ toast('Limite de alterações já atingido.'); return; }
  await dbSet('stages', id, {changesUsed: used+1});
  await logActivity(`Alteração registrada na etapa "${st.name}" (${used+1}/${max}).`, 'project');
  toast('Alteração registrada.');
}

async function handleGeneralFilesSelected(files){
  if(!files || !files.length) return;
  // Lê os campos do modal (se ainda aberto) antes de fechar.
  const clientId = val('f_client')||null, projectId = val('f_project')||null, category = val('f_category')||'';
  closeModal();
  if(S.dataBackend!=='supabase'){
    for(const file of Array.from(files)){
      await dbAdd('files', { name:file.name, clientId, projectId, category, type:guessFileTypeLabel(file), fileSize:file.size });
    }
    toast('Arquivo registrado (modo local — sem upload real).');
    if(!S.dbAvailable) render();
    return;
  }
  let added = 0;
  for(const file of Array.from(files)){
    let uploadedPath = null;
    try{
      uploadedPath = await uploadFileToStorageBucket(file);
      try{
        await dbAdd('files', { name:file.name, clientId, projectId, category, type:guessFileTypeLabel(file), fileSize:file.size, storagePath:uploadedPath });
        added++;
      }catch(dbErr){
        await removeFromStorageBucket(uploadedPath);
        throw dbErr;
      }
    }catch(e){
      console.error('[Storage] Falha ao enviar arquivo:', e);
      toast(storageErrorMessage(e));
    }
  }
  if(added){
    await logActivity(`${added>1? added+' arquivos adicionados' : 'Arquivo adicionado'}.`, 'file');
    toast(added>1? `${added} arquivos enviados.` : 'Arquivo enviado.');
  }
}

}

/* ---------------- Delegated event handling (CSP-safe: no inline on* attributes) ----------------
   Published artifact pages run in a sandboxed environment whose content-security
   policy does not allow inline event-handler attributes (onclick="…" etc.), even
   though the page's own inline <script> is allowed to run. Every interactive
   element in this app is wired instead via data-act / data-change-act / etc.
   attributes read by these delegated listeners, and dispatched to real function
   references (never eval/new Function), so nothing here depends on inline
   attribute execution being permitted. */

  setView, openDrawer, closeDrawer, closeModal, openTasksFiltered, rerenderCurrentView,
  openClientForm, saveClient, openLeadForm, saveLead, openProjectForm, saveProject,
  openTaskForm, saveTask, updateTaskStatus, confirmDeleteEntity,

  setCashflowRange, notifClickThrough,
  handleLeadDrop, openAgendaItemDrawer, leadDragStart,

  submitLogin, logout,
  toggleCompletedTasksSection, toggleEventStatus, toggleNavGroup, toggleFavoriteNavItem,
  triggerStageFileInput, openStageFileUrl, confirmDeleteStageFile, deleteStageFile, downloadStageFile,
  runConfirmCallback, saveQuickDueDate, clearChecklistDueDate,
  openProjectWorkspace, setProjectWorkspaceTab, backToProjects, toggleProjectQuickMenu, wsQuickAction, saveProjectNotes,
  openStageInline, backToStagesList, setStageSubTab, goToAdjacentStage,
  quickSetChecklistDueDate,
  openLeadPipelineConfig, openLeadStageForm, saveLeadStage, moveLeadStage, convertLeadToClient,
};
const CHANGE_ACTIONS = {
  setFileClientFilter, setSupplierCategory, setTaskPriorityFilter, setTaskStatusFilter,
  autoFillClientFromProject, changeIssueStatus, changeLeadStage,
  changeTaskStatusAndClose, changeTxnStatusAndClose, updateTaskStatus,
  changeStageStatus, changeChecklistStatus, toggleChecklistCheckbox, changeChecklistStatusAndClose,

};

const FOCUS_ACTIONS = { refocusSearch };

function readArgs(el, attr){
  const raw = el.getAttribute(attr);
  if(!raw) return [];
  try{ const v = JSON.parse(raw); return Array.isArray(v) ? v : [v]; }catch(e){ return []; }
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act],[data-stop]');
  if(!el) return;
  if(el.hasAttribute('data-stop')) return; // swallow: nested interactive control handles its own event
  if(el.hasAttribute('data-self-only') && e.target !== el) return; // backdrop click-outside-to-close
  const action = el.getAttribute('data-act');
  const fn = ACTIONS[action];
  if(typeof fn === 'function') fn(...readArgs(el, 'data-args'));
});

document.addEventListener('change', function(e){
  const el = e.target.closest('[data-change-act]');
  if(!el) return;
  const action = el.getAttribute('data-change-act');
  const fn = CHANGE_ACTIONS[action];
  const value = el.type==='checkbox' ? el.checked : el.type==='file' ? el.files : el.value;
  if(typeof fn === 'function') fn(...readArgs(el, 'data-args'), value);
});

// (handlePhotoFilesSelected), sem nenhuma lógica de armazenamento paralela.
document.addEventListener('paste', function(e){
  if(!(S.currentStageId && S.stageSubTab==='fotos')) return;
  const items = e.clipboardData && e.clipboardData.items; if(!items) return;
  const imageFiles = [];
  for(const item of items){
    if(item.kind==='file' && item.type && item.type.startsWith('image/')){
      const file = item.getAsFile();
      if(file) imageFiles.push(file);
    }
  }
  if(!imageFiles.length) return; // nunca aceita texto colado como imagem
  e.preventDefault();
  toast(imageFiles.length>1? `${imageFiles.length} imagens coladas — processando…` : 'Imagem colada — processando…');
  handlePhotoFilesSelected(S.currentStageId, imageFiles);
});

document.addEventListener('input', function(e){
  const el = e.target.closest('[data-input-act]');
  if(!el) return;
  const action = el.getAttribute('data-input-act');
  const fn = INPUT_ACTIONS[action];
  if(typeof fn === 'function') fn(el.value);
});

// Formulário de login: precisa ser um <form> de verdade, com submit real, para
// o gerenciador de senhas do navegador oferecer salvar/preencher — mas sem
// deixar o navegador de fato recarregar a página ao enviar.
document.addEventListener('submit', function(e){
  if(e.target && e.target.id==='loginFormEl'){
    e.preventDefault();
    submitLogin();
  }
});

document.addEventListener('focus', function(e){
  const el = e.target.closest && e.target.closest('[data-focus-act]');
  if(!el) return;
  const action = el.getAttribute('data-focus-act');
  const fn = FOCUS_ACTIONS[action];
  if(typeof fn === 'function') fn(el.value);
}, true); // focus doesn't bubble — must use capture phase

document.addEventListener('dragstart', function(e){
  const el = e.target.closest('[data-dragstart-act]');
  if(!el) return;
  const action = el.getAttribute('data-dragstart-act');
  const fn = ACTIONS[action];
  el.classList.add('dragging');
  if(typeof fn === 'function') fn(...readArgs(el, 'data-dragstart-args'), el);
});
document.addEventListener('dragend', function(e){
  const el = e.target.closest('[data-dragstart-act]');
  if(el) el.classList.remove('dragging');
});
document.addEventListener('dragover', function(e){
  const el = e.target.closest('[data-dropzone]');
  if(!el) return;
  e.preventDefault();
  el.classList.add('drop-hover');
});
document.addEventListener('dragleave', function(e){
  const el = e.target.closest('[data-dropzone]');
  if(el) el.classList.remove('drop-hover');
});
document.addEventListener('drop', function(e){
  const el = e.target.closest('[data-drop-act]');
  if(!el) return;
  e.preventDefault();
  el.classList.remove('drop-hover');
  const action = el.getAttribute('data-drop-act');
  const fn = ACTIONS[action];
  if(typeof fn === 'function') fn(...readArgs(el, 'data-args'));
});
