<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estúdio — Gestão para Escritórios de Arquitetura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1B19;
  --ink-soft:#4A4640;
  --ink-faint:#8B8578;
  --paper:#F5F3EE;
  --paper-raised:#FCFBF8;
  --line:#E4E0D6;
  --line-strong:#D3CDBE;
  --accent:#2B4A3D;
  --accent-soft:#E7EEE9;
  --accent-strong:#1D3329;
  --info:#3E6FA6;
  --info-soft:#E8EFF6;
  --warning:#C08A2E;
  --warning-soft:#FAF1DF;
  --danger:#B5423B;
  --danger-soft:#FBEAE8;
  --success:#3D7A5C;
  --success-soft:#E7F1EB;
  --radius-s:4px;
  --radius-m:8px;
  --shadow-card:0 1px 2px rgba(28,27,25,0.06), 0 1px 1px rgba(28,27,25,0.04);
  --shadow-pop:0 12px 32px rgba(28,27,25,0.16), 0 2px 8px rgba(28,27,25,0.08);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ink:#EDEAE2; --ink-soft:#C4BFB3; --ink-faint:#8B8578;
    --paper:#17181A; --paper-raised:#1F2022; --line:#2C2D2E; --line-strong:#3A3B3C;
    --accent:#6FA98A; --accent-soft:#1E2C25; --accent-strong:#8FC2A4;
    --info:#7FA8D4; --info-soft:#1B2733; --warning:#DDB05C; --warning-soft:#332A17;
    --danger:#DE8177; --danger-soft:#331E1B; --success:#7EC3A0; --success-soft:#1B2E24;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEAE2; --ink-soft:#C4BFB3; --ink-faint:#8B8578;
  --paper:#17181A; --paper-raised:#1F2022; --line:#2C2D2E; --line-strong:#3A3B3C;
  --accent:#6FA98A; --accent-soft:#1E2C25; --accent-strong:#8FC2A4;
  --info:#7FA8D4; --info-soft:#1B2733; --warning:#DDB05C; --warning-soft:#332A17;
  --danger:#DE8177; --danger-soft:#331E1B; --success:#7EC3A0; --success-soft:#1B2E24;
}
*{box-sizing:border-box;}
/* Rede de segurança: todo ícone (nenhum tem width/height próprio, dependem do
   contexto) recebe um tamanho padrão razoável se nenhuma regra mais específica
   o dimensionar. Seletores de classe (ex: .icon-btn svg) continuam vencendo. */
svg{width:1em;height:1em;flex:0 0 auto;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Spectral',Georgia,serif;}
::selection{background:var(--accent-soft);}
a{color:inherit;}
button{font-family:inherit;}
.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:248px;flex:0 0 248px;background:var(--paper-raised);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  z-index:20;
}
.brand{
  padding:22px 20px 16px;display:flex;align-items:center;gap:10px;
}
.brand-mark{
  width:30px;height:30px;border-radius:6px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.brand-mark svg{width:16px;height:16px;stroke:var(--paper-raised);}
.brand-name{font-family:'Spectral';font-size:18px;font-weight:600;letter-spacing:.2px;}
.nav{padding:6px 12px 24px;flex:1;}
.nav-group{margin-top:18px;}
.nav-group:first-child{margin-top:4px;}
.nav-group-label{
  font-size:11px;color:var(--ink-faint);padding:0 10px 6px;
  font-weight:600;letter-spacing:.04em;
}
.nav-group-label-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.nav-collapse-caret{font-size:12px;opacity:.7;}
.nav-item-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nav-item-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.nav-fav{font-size:14px;color:var(--ink-faint);cursor:pointer;flex:0 0 auto;line-height:1;padding:2px;}
.nav-fav:hover{color:var(--warning);}
.nav-fav.is-fav{color:var(--warning);}
.nav-empty-hint{font-size:12px;color:var(--ink-faint);padding:2px 10px 6px;margin:0;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border-radius:var(--radius-s);cursor:pointer;color:var(--ink-soft);
  font-size:13.5px;margin-bottom:1px;transition:background .12s ease,color .12s ease;
  position:relative;
}
.nav-item:hover{background:var(--line);color:var(--ink);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;}
.nav-item svg{width:16px;height:16px;flex:0 0 auto;opacity:.85;}
.nav-item .count{
  margin-left:auto;font-size:11px;color:var(--ink-faint);
  background:var(--line);padding:1px 6px;border-radius:10px;
}
.nav-item.active .count{background:var(--accent);color:var(--paper-raised);}
.sidebar-foot{
  padding:14px 20px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.avatar{
  width:30px;height:30px;border-radius:50%;background:var(--accent);
  color:var(--paper-raised);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;flex:0 0 auto;
}
.sidebar-foot-text{font-size:12.5px;}
.sidebar-foot-text .name{font-weight:600;}
.sidebar-foot-text .role{color:var(--ink-faint);font-size:11.5px;}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:60px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 28px;
  position:sticky;top:0;background:rgba(245,243,238,0.88);backdrop-filter:blur(6px);
  z-index:10;
}
:root[data-theme="dark"] .topbar,:root:not([data-theme="light"]) .topbar{
  @media (prefers-color-scheme: dark){ background:rgba(23,24,26,0.88); }
}
.search-box{
  flex:1;max-width:420px;display:flex;align-items:center;gap:8px;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:7px 12px;color:var(--ink-faint);
}
.search-box svg{width:15px;height:15px;flex:0 0 auto;}
.search-box input{
  border:none;background:transparent;outline:none;font-size:13.5px;color:var(--ink);width:100%;
}
.topbar-spacer{flex:1;}
.icon-btn{
  width:34px;height:34px;border-radius:var(--radius-s);border:1px solid transparent;
  background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--ink-soft);position:relative;
}
.icon-btn:hover{background:var(--line);}
.icon-btn svg{width:17px;height:17px;}
.icon-btn .dot{
  position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--danger);
}
.view{flex:1;padding:28px 32px 60px;max-width:1320px;width:100%;margin:0 auto;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  padding:8px 14px;border-radius:var(--radius-s);border:1px solid var(--line-strong);
  background:var(--paper-raised);color:var(--ink);cursor:pointer;white-space:nowrap;
  transition:background .12s ease, border-color .12s ease, transform .05s ease;
}
.btn:hover{border-color:var(--ink-faint);}
.btn:active{transform:translateY(1px);}
.btn svg{width:14px;height:14px;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--paper-raised);}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn-ghost{border-color:transparent;background:none;}
.btn-ghost:hover{background:var(--line);}
.btn-danger-text{color:var(--danger);border-color:transparent;background:none;}
.btn-danger-text:hover{background:var(--danger-soft);}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.btn-danger:hover{background:#9c332c;border-color:#9c332c;}
.btn-sm{padding:5px 10px;font-size:12.5px;}

/* ---------- Page header ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.page-eyebrow{font-size:12.5px;color:var(--ink-faint);margin-bottom:4px;}
.page-title{font-size:26px;font-weight:500;margin:0;}
.page-sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;max-width:520px;}
.page-actions{display:flex;gap:8px;}

/* ---------- Cards / grid ---------- */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
@media (max-width:1080px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}}
.card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-m);
  box-shadow:var(--shadow-card);
}
.card-pad{padding:18px 20px;}
.stat-card{padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:default;}
.stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-label{font-size:12px;color:var(--ink-faint);font-weight:600;letter-spacing:.01em;}
.stat-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.stat-icon svg{width:14px;height:14px;}
.stat-value{font-family:'Spectral';font-size:30px;font-weight:500;line-height:1;}
.stat-list{display:flex;flex-direction:column;gap:4px;margin-top:2px;}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
  padding:5px 0;border-top:1px solid var(--line);color:var(--ink-soft);cursor:pointer;
}
.stat-row:hover{color:var(--ink);}
.stat-row b{color:var(--ink);font-weight:600;}

.section-title{font-size:15px;font-weight:600;margin:0 0 2px;display:flex;align-items:center;justify-content:space-between;}
.section-block{margin-top:26px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.link-btn{font-size:12.5px;color:var(--accent);cursor:pointer;font-weight:600;}
.link-btn:hover{text-decoration:underline;}

/* Alerts */
.alert-row{
  display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:var(--radius-s);
  border:1px solid var(--line);margin-bottom:8px;font-size:13px;background:var(--paper-raised);
}
.alert-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:0 0 auto;}
.alert-dot.red{background:var(--danger);}
.alert-dot.amber{background:var(--warning);}
.alert-text b{font-weight:600;}
.alert-meta{color:var(--ink-faint);font-size:12px;margin-top:1px;}

/* Activity timeline */
.tl-item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);}
.tl-item:first-child{border-top:none;}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:0 0 auto;}
.tl-text{font-size:13px;}
.tl-time{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}

/* Empty state */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 20px;text-align:center;color:var(--ink-faint);gap:10px;
}
.empty svg{width:36px;height:36px;opacity:.5;}
.empty-title{color:var(--ink);font-weight:600;font-size:14.5px;}
.empty p{margin:0;max-width:320px;font-size:13px;}

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.3px;}
thead th{
  text-align:left;font-size:11.5px;color:var(--ink-faint);font-weight:600;letter-spacing:.02em;
  padding:0 14px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;
}
tbody td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr{cursor:pointer;transition:background .1s ease;}
tbody tr:hover{background:var(--accent-soft);}
tbody tr:last-child td{border-bottom:none;}
.cell-primary{font-weight:600;}
.cell-sub{color:var(--ink-faint);font-size:12px;margin-top:1px;}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:20px;white-space:nowrap;
}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;}
.b-success{background:var(--success-soft);color:var(--success);}
.b-success::before{background:var(--success);}
.b-info{background:var(--info-soft);color:var(--info);}
.b-info::before{background:var(--info);}
.b-warning{background:var(--warning-soft);color:var(--warning);}
.b-warning::before{background:var(--warning);}
.b-danger{background:var(--danger-soft);color:var(--danger);}
.b-danger::before{background:var(--danger);}
.b-neutral{background:var(--line);color:var(--ink-soft);}
.b-neutral::before{background:var(--ink-faint);}

.pill{
  display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;
  padding:3px 8px;border-radius:5px;background:var(--line);color:var(--ink-soft);
}
.priority-alta{background:var(--danger-soft);color:var(--danger);}
.priority-media{background:var(--warning-soft);color:var(--warning);}
.priority-baixa{background:var(--success-soft);color:var(--success);}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filter-select, .filter-input{
  border:1px solid var(--line-strong);background:var(--paper-raised);border-radius:var(--radius-s);
  padding:7px 10px;font-size:12.8px;color:var(--ink);outline:none;
}
.filter-input{min-width:220px;}
.view-toggle{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius-s);overflow:hidden;margin-left:auto;}
.view-toggle button{
  border:none;background:var(--paper-raised);padding:7px 12px;font-size:12.5px;cursor:pointer;
  color:var(--ink-soft);border-right:1px solid var(--line-strong);
}
.view-toggle button:last-child{border-right:none;}
.view-toggle button.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;}

/* Kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{flex:0 0 260px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);display:flex;flex-direction:column;max-height:calc(100vh - 260px);}
.kanban-col-head{
  padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;font-weight:600;position:sticky;top:0;background:var(--paper);border-radius:var(--radius-m) var(--radius-m) 0 0;
}
.kanban-col-head .n{color:var(--ink-faint);font-weight:500;background:var(--line);border-radius:10px;padding:1px 7px;font-size:11px;}
.kanban-body{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
.kanban-card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 11px;
  cursor:grab;font-size:12.6px;box-shadow:var(--shadow-card);
}
.kanban-card:active{cursor:grabbing;}
.kanban-card.dragging{opacity:.4;}
.kanban-col.drop-hover{background:var(--accent-soft);}
.kc-title{font-weight:600;margin-bottom:5px;}
.kc-meta{color:var(--ink-faint);font-size:11.3px;display:flex;flex-direction:column;gap:2px;}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(20,19,17,0.42);display:flex;align-items:flex-start;
  justify-content:center;padding:4vh 20px;z-index:100;overflow-y:auto;
}
.modal{
  background:var(--paper-raised);border-radius:var(--radius-m);width:100%;max-width:560px;
  box-shadow:var(--shadow-pop);margin-bottom:4vh;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:17px;font-weight:600;}
.modal-body{padding:20px 22px;max-height:64vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
.form-field input,.form-field select,.form-field textarea{
  border:1px solid var(--line-strong);border-radius:var(--radius-s);padding:8px 10px;
  font-size:13px;font-family:inherit;background:var(--paper);color:var(--ink);outline:none;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent);}
.form-field textarea{resize:vertical;min-height:60px;}

/* Drawer (detail view) */
.drawer-overlay{position:fixed;inset:0;background:rgba(20,19,17,0.32);z-index:90;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--paper-raised);
  border-left:1px solid var(--line);box-shadow:var(--shadow-pop);z-index:95;overflow-y:auto;
  animation:slidein .18s ease;
}
@keyframes slidein{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.drawer-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.drawer-body{padding:20px 22px;}
.dr-field{margin-bottom:16px;}
.dr-label{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-bottom:3px;}
.dr-value{font-size:14px;}
.dr-row{display:flex;gap:20px;}
.dr-row .dr-field{flex:1;}
.dr-section-title{font-size:12px;font-weight:700;color:var(--ink-faint);text-transform:none;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line);}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--radius-s);
  font-size:13px;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:8px;
  animation:toastin .18s ease;
}
:root[data-theme="dark"] .toast, :root:not([data-theme="light"]) .toast{
  @media (prefers-color-scheme:dark){ background:var(--accent);color:#0d130f; }
}
@keyframes toastin{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.progress-track{height:5px;border-radius:3px;background:var(--line);overflow:hidden;width:100%;}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease;}

/* Gantt */
.gantt-wrap{overflow-x:auto;}
.gantt{min-width:900px;}
.gantt-header{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--line-strong);padding-bottom:8px;margin-bottom:6px;}
.gantt-months{display:flex;}
.gantt-month{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-faint);border-left:1px solid var(--line);padding-bottom:4px;}
.gantt-row{display:grid;grid-template-columns:220px 1fr;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
.gantt-row-label{font-size:12.8px;font-weight:600;padding-right:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gantt-row-label .sub{font-weight:400;color:var(--ink-faint);font-size:11px;}
.gantt-track{position:relative;height:22px;background:var(--paper);border-radius:4px;}
.gantt-bar{position:absolute;top:2px;height:18px;border-radius:4px;background:var(--accent);cursor:pointer;display:flex;align-items:center;padding:0 8px;overflow:hidden;}
.gantt-bar span{font-size:10.5px;color:var(--paper-raised);font-weight:600;white-space:nowrap;}
.gantt-bar.late{background:var(--danger);}
.gantt-bar.done{background:var(--success);}
.gantt-bar.soon{background:var(--warning);}

/* Category swatches for fornecedores */
.cat-swatch{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;}

/* Cashflow bar chart */
.cf-chart{display:flex;align-items:flex-end;gap:14px;height:220px;padding:10px 6px 0;border-bottom:1px solid var(--line-strong);overflow-x:auto;}
.cf-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:0 0 64px;height:100%;position:relative;}
.cf-bars{display:flex;align-items:flex-end;gap:4px;height:100%;}
.cf-bar{width:16px;border-radius:3px 3px 0 0;position:relative;min-height:2px;}

// Fonte única de verdade para o "dono" dos dados enquanto não existe login.
// Corresponde exatamente à Opção C aprovada: um UUID fixo representando a
// Vanessa durante o desenvolvimento, com uma exceção estreita e reversível
// nas políticas de RLS do Supabase (não implementada nesta etapa).
// NENHUMA função de CRUD usa isto ainda — só existe para já termos um único
// lugar para buscar esse valor quando a hora chegar, em vez de espalhar o
// UUID pelo código.
const DEV_OWNER_ID = '11111111-1111-1111-1111-111111111111';
async function getCurrentOwnerId(){
  // Fonte única de verdade sobre "quem está fazendo esta operação". Antes de
  // qualquer escrita real contra o Supabase, confirma a identidade DIRETO com
  // o servidor (client.auth.getUser()) em vez de confiar cegamente no
  // S.currentUserId em cache — isso garante que o owner_id que enviamos é
  // exatamente o mesmo auth.uid() que o Postgres vai calcular no RLS, mesmo
  // que a sessão tenha sido renovada silenciosamente (refresh de token) desde
  // o último evento que atualizou nosso estado local. Sem essa confirmação,
  // um valor em cache desatualizado pode divergir do auth.uid() real e a
  // política de RLS (owner_id = auth.uid()) rejeita a escrita.
  if(S.dataBackend==='supabase'){
    const client = getSupabaseClient();
    if(client){
      try{
        const { data, error } = await client.auth.getUser();
        if(!error && data && data.user){
          if(S.currentUserId !== data.user.id){
            S.currentUserId = data.user.id;
            S.currentUser = { id: data.user.id, email: data.user.email };
          }
          S.authenticated = true;
          return data.user.id;
        }
      }catch(e){
        console.warn('[Auth] getCurrentOwnerId(): falha ao confirmar usuário com o servidor', e);
      }
    }
  }
  // Sem sessão real confirmável, cai no UUID fixo de desenvolvimento — só
  // serve para testes/simulação local (nunca é aceito pelas políticas de RLS
  // do banco real).
  if(S.authenticated && S.currentUserId) return S.currentUserId;
  return DEV_OWNER_ID;
}

/* ---------------- Supabase Auth (Etapa 2C) ----------------
   Identidade real do usuário. Fonte única de verdade: S.authenticated /
   S.currentUser / S.currentUserId / S.authLoading / S.authError, todas
   atualizadas só por applySessionToState() — nenhum outro lugar do código
   mexe nelas diretamente. */
let _authListenerBound = false;

async function initSupabaseAuth(){
  const client = getSupabaseClient();
  if(!client){
    // getSupabaseClient() retornou null (config ausente/lib não carregada)
    // — nada a inicializar. Não é erro: o backend padrão continua 'claude'.
    S.authLoading = false;
    if(S.dataBackend==='supabase') render();
    return;
  }
  S.authLoading = true;
  if(S.dataBackend==='supabase') render();
  try{
    const { data, error } = await client.auth.getSession();
    if(error) throw error;
    applySessionToState(data && data.session);
  }catch(e){
    console.warn('[Auth] falha ao recuperar sessão existente', e);
    applySessionToState(null);
  }
  S.authLoading = false;
  if(!_authListenerBound){
    _authListenerBound = true;
    client.auth.onAuthStateChange((event, session) => {
      if(event==='SIGNED_OUT'){
        applySessionToState(null);
        // Distingue "a pessoa clicou em Sair" (logout()) de uma sessão que
        // expirou sozinha — só o segundo caso mostra o aviso de expiração.
        if(!S._manualLogout) S.authError = 'Sua sessão expirou. Entre novamente.';
        S._manualLogout = false;
      } else {
        applySessionToState(session);
      }
      render();
    });
  }
  render();
}

function applySessionToState(session){
  const wasAuthenticated = S.authenticated;
  if(session && session.user){
    S.authenticated = true;
    S.currentUser = { id: session.user.id, email: session.user.email };
    S.currentUserId = session.user.id;
    S.authError = null;
  } else {
    S.authenticated = false;
    S.currentUser = null;
    S.currentUserId = null;
  }
  // Assim que uma sessão real é confirmada — login novo OU sessão restaurada
  // ao recarregar a página — carrega os dados reais do Supabase. Só dispara
  // na transição de "não autenticado" para "autenticado" (nunca de novo em
  // eventos subsequentes do listener, como um simples refresh de token, o
  // que evitaria recarregar as 27 tabelas à toa). Nunca lê usando o
  // DEV_OWNER_ID — só a identidade real é usada aqui.
  if(S.dataBackend==='supabase' && S.authenticated && !wasAuthenticated){
    loadAllFromSupabase();
  }
}

async function loadAllFromSupabase(){
  // Carga inicial das 27 tabelas a partir do Supabase real, respeitando o
  // RLS (owner_id = auth.uid()) através da sessão já autenticada — nenhum
  // filtro artificial é adicionado aqui; o próprio banco já só devolve o
  // que pertence ao usuário logado.
  const client = getSupabaseClient();
  if(!client){
    console.warn('[Supabase] loadAllFromSupabase(): cliente não configurado, nada a carregar.');
    return;
  }
  if(!S.authenticated || !S.currentUserId){
    // Nunca usa o DEV_OWNER_ID para ler dados reais — sem sessão de verdade,
    // não há o que buscar (o Auth Gate já está sendo mostrado nessa hora).
    console.warn('[Supabase] loadAllFromSupabase(): chamada sem sessão autenticada — abortando.');
    return;
  }
  const cols = ['clients','leads','projects','tasks','activity','sites','diary','issues','suppliers','files','transactions','events','notif_reads','stages','checklist_items','stage_photos','stage_files','project_templates','template_stages','template_checklist_items','template_files','time_entries','activity_types','lead_stages','site_templates','template_site_checklist_items','app_meta'];
  const results = await Promise.all(cols.map(async col => {
    try{
      const { data, error } = await client.from(col).select('*');
      if(error) throw error;
      return { col, rows: (data||[]).map(row => fromSupabaseRow(col, row)) };
    }catch(e){
      // Nunca esconde o erro — registra exatamente qual tabela falhou e por
      // quê, e NÃO apaga o que já estava carregado das outras tabelas.
      console.error(`[Supabase] Falha ao carregar a tabela "${col}":`, e);
      return { col, error: e };
    }
  }));
  results.forEach(r => {
    if(r.error) return; // preserva o conteúdo anterior de S[r.col] nesse caso
    S[r.col] = r.rows;
  });
  S.ready = true;
  render();
}

async function submitLogin(){
  const email = (val('f_login_email')||'').trim();
  const password = val('f_login_password')||'';
  if(!email || !password){
    S.authError = 'Informe e-mail e senha.';
    render();
    return;
  }
  const client = getSupabaseClient();
  if(!client){
    S.authError = 'Não foi possível conectar ao Supabase (configuração ausente).';
    render();
    return;
  }
  S.authLoading = true; S.authError = null; render();
  try{
    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if(error){
      // Mensagens diferentes para credencial errada vs. problema de conexão —
      // a biblioteca do Supabase usa o campo status/name para isso.
      if(error.status===400 || /invalid/i.test(error.message||'')){
        S.authError = 'E-mail ou senha incorretos.';
      } else {
        S.authError = 'Erro de conexão ao entrar — verifique sua internet e tente novamente.';
      }
      throw error;
    }
    // "Lembrar meu usuário": guarda SOMENTE o e-mail — a senha nunca é salva
    // em lugar nenhum. Isso não interfere na sessão real do Supabase Auth
    // (que já persiste sozinha, via getSession() no boot).
    try{
      const remember = document.getElementById('f_login_remember');
      if(remember && remember.checked) localStorage.setItem('estudio:remembered_email', email);
      else localStorage.removeItem('estudio:remembered_email');
    }catch(e){}
    applySessionToState(data.session);
  }catch(e){
    if(!S.authError) S.authError = 'Não foi possível entrar. Tente novamente.';
  }finally{
    S.authLoading = false;
    render();
  }
}

async function logout(){
  const client = getSupabaseClient();
  S._manualLogout = true;
  if(client){
    try{ await client.auth.signOut(); }catch(e){ console.warn('[Auth] erro ao encerrar sessão', e); }
  }
  applySessionToState(null);
  render();
}


/* ---------------- Tradução de campos: app (camelCase) ↔ Supabase (snake_case) ----------------
   O app inteiro (todas as telas, ~150+ campos) usa camelCase (ex: dueDate, projectId).
   As colunas do banco Supabase usam snake_case (ex: due_date, project_id) — convenção
   padrão do Postgres. Esta camada traduz nos dois sentidos, coleção por coleção, para
   que absolutamente nenhuma tela precise saber qual convenção o banco atual usa. */
const SUPABASE_FIELD_OVERRIDES = {
  // Casos que NÃO são uma simples troca de maiúscula por "_" — nomeados assim
  // no banco por razões próprias (ex: "order" é palavra reservada em SQL).
  stages: { order: 'stage_order' },
  template_stages: { order: 'stage_order' },
  lead_stages: { order: 'stage_order' },
  template_site_checklist_items: { order: 'item_order' },
  leads: { stage: 'stage_id' },
};
function camelToSnake(str){ return str.replace(/[A-Z]/g, m => '_'+m.toLowerCase()); }
function snakeToCamel(str){ return str.replace(/_([a-z0-9])/g, (_, c) => c.toUpperCase()); }

// time_entries é um caso à parte: o app usa kind+itemId (polimórfico) em ~40
// pontos do cronômetro; o banco novo usa task_id/checklist_item_id. Esta
// tradução fica isolada aqui — NENHUM desses ~40 pontos precisa saber que
// ela existe, e esta etapa não mexe em nenhum deles (só a "portinha" de
// entrada/saída dos dados muda).
function timeEntryOutgoingExtra(jsObj){
  const extra = {task_id:null, checklist_item_id:null};
  if(jsObj.kind==='task') extra.task_id = jsObj.itemId ?? null;
  else if(jsObj.kind==='checklist') extra.checklist_item_id = jsObj.itemId ?? null;
  return extra;
}
function timeEntryIncomingExtra(pgRow){
  if(pgRow.task_id) return {kind:'task', itemId:pgRow.task_id};
  if(pgRow.checklist_item_id) return {kind:'checklist', itemId:pgRow.checklist_item_id};
  return {kind:null, itemId:null};
}

function toSupabaseRow(col, jsObj){
  // Converte um objeto no formato interno do app para o formato de linha do Postgres.
  // Nunca inclui id/createdAt/updatedAt/owner_id — cada chamador decide se/como
  // esses entram (id e owner_id são tratados à parte pelo dbAdd/dbSet/dbDelete;
  // created_at/updated_at são sempre automáticos do banco, nunca enviados).
  const overrides = SUPABASE_FIELD_OVERRIDES[col] || {};
  const row = {};
  for(const [k,v] of Object.entries(jsObj)){
    if(k==='id' || k==='createdAt' || k==='updatedAt' || k==='_optimistic' || k==='owner_id') continue;
    if(col==='time_entries' && (k==='kind' || k==='itemId')) continue; // tratado à parte abaixo
    const pgKey = overrides[k] || camelToSnake(k);
    row[pgKey] = v===undefined? null : v;
  }
  if(col==='time_entries') Object.assign(row, timeEntryOutgoingExtra(jsObj));
  return row;
}
function fromSupabaseRow(col, pgRow){
  // Caminho inverso: linha do Postgres → formato interno do app (camelCase),
  // para que S[coleção] fique com exatamente a mesma forma, venha o dado de
  // onde vier (Claude ou Supabase).
  const overrides = SUPABASE_FIELD_OVERRIDES[col] || {};
  const reverse = {}; for(const [k,v] of Object.entries(overrides)) reverse[v] = k;
  const obj = {};
  for(const [k,v] of Object.entries(pgRow)){
    if(k==='owner_id') continue; // não faz parte do formato usado pelas telas
    if(k==='created_at'){ obj.createdAt = v? new Date(v).getTime() : Date.now(); continue; }
    if(k==='updated_at'){ obj.updatedAt = v? new Date(v).getTime() : Date.now(); continue; }
    if(col==='time_entries' && (k==='task_id' || k==='checklist_item_id')) continue; // tratado à parte abaixo
    const jsKey = reverse[k] || snakeToCamel(k);
    obj[jsKey] = v;
  }
  if(col==='time_entries') Object.assign(obj, timeEntryIncomingExtra(pgRow));
  return obj;
}

      await seedIfEmptyLocal(); render(); return;
    }
    S.db = db; S.dbAvailable = true;
    announceDbStatus(true, 'banco real conectado.');
    subscribeAll();

function announceDbStatus(available, detail){

function subscribeAll(){
  const cols = ['clients','leads','projects','tasks','activity','sites','diary','issues','suppliers','files','transactions','events','notif_reads','stages','checklist_items','stage_photos','stage_files','project_templates','template_stages','template_checklist_items','template_files','time_entries','activity_types','lead_stages','site_templates','template_site_checklist_items','app_meta'];
  let loaded = 0;
  cols.forEach(col=>{
    S.db.collection(col).onSnapshot(snap=>{
      const docs = snap.docs ? snap.docs.map(d=>({id:d.id,...d.data})) : [];
      // Guard against a stale/in-flight snapshot silently reverting a local
      // optimistic write whose server confirmation hasn't propagated back
      // through this listener yet (see dbSet/S._pendingWrites). Without this,
      // a snapshot that was already "in the pipe" before our write can arrive
      // afterwards and clobber the change the user just made — the update
      // then LOOKS like it "didn't happen" anywhere that reads S[col], even
      // though the write itself succeeded. This is a single-source-of-truth
      // bug, not a per-screen refresh bug, so it's fixed here once, centrally.
      const merged = docs
        .filter(d=> !S._pendingDeletes[col+':'+d.id])
        .map(d=>{
          const key = col+':'+d.id;
          const pending = S._pendingWrites[key];
          return pending ? {...d, ...pending} : d;
        });
      // Keep any not-yet-confirmed local creates visible through this snapshot
      // too — see the matching guard in dbAdd().
      const pendingAdds = Object.values(S._pendingAdds[col] || {});
      S[col] = [...pendingAdds, ...merged].sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
      if(!S.ready){
        loaded++;
        if(loaded>=cols.length){
          S.ready = true;
          maybeSeed();
        }
      } else {
        render();
      }
    }, err=>{ console.warn('db error', col, err); });
  });
}

async function maybeSeed(){
  // DADOS DE DEMONSTRAÇÃO — usados apenas para desenvolvimento/primeira execução.
  // Uma vez que o sistema já foi semeado (ou já existe qualquer dado real), NUNCA
  // mais recriar os exemplos automaticamente — nem mesmo se a Vanessa apagar tudo
  // de propósito depois. A marca abaixo garante isso mesmo entre recarregamentos.
  const alreadySeeded = S.app_meta.some(m=>m.id==='seed_status' && m.seeded);
  const looksEmpty = S.clients.length===0 && S.leads.length===0 && S.projects.length===0 && S.tasks.length===0;
  if(!alreadySeeded && looksEmpty){
    try{
      await seedDemoData();
      await dbSet('app_meta', 'seed_status', {seeded:true, seededAt:Date.now()}, {upsert:true});
    }catch(e){
      console.warn('Seeding failed partway through — continuing with whatever was written so far.', e);
    }
  } else if(!alreadySeeded){
    // Existing real data was found without our marker (e.g. imported data, or an
    // older session) — record that seeding should be considered done so it's
    // never triggered later just because collections happen to empty out.
    await dbSet('app_meta', 'seed_status', {seeded:true, seededAt:Date.now()}, {upsert:true});
  }
  render();
}

function formatDuration(totalSeconds){
  totalSeconds = Math.max(0, Math.floor(totalSeconds||0));
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function formatDurationShort(totalSeconds){
  totalSeconds = Math.max(0, Math.floor(totalSeconds||0));
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  if(h && m) return `${h}h${String(m).padStart(2,'0')}min`;
  if(h) return `${h}h`;
  return `${m}min`;
}
function entrySeconds(e){
  if(e.status==='running') return Math.floor((Date.now()-new Date(e.startedAt).getTime())/1000);
  return e.durationSeconds||0;
}
function itemEntries(kind, itemId){ return S.time_entries.filter(e=>e.kind===kind && e.itemId===itemId); }
function itemTotalSeconds(kind, itemId){ return itemEntries(kind,itemId).reduce((s,e)=>s+entrySeconds(e),0); }

  }
  await dbAdd('time_entries', {
    kind, itemId, projectId, stageId, activityType, responsible,

    status:'running', manuallyAdded:false, notes:'', date: todayISO(),

  await dbSet('time_entries', entryId, {status:'paused', endedAt:new Date().toISOString(), durationSeconds:dur});

}
async function finishTimer(entryId){

}

function playAlarmBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    [0, 0.26].forEach(offset=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now+offset);
      gain.gain.exponentialRampToValueAtTime(0.28, now+offset+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+offset); osc.stop(now+offset+0.22);
    });
  }catch(e){ /* ambiente sem suporte a áudio — ignora silenciosamente */ }
}
async function fireAlarm(kind, itemId, thresholdMin, repeatMin){
  const col = kind==='task'? 'tasks' : 'checklist_items';
  if(repeatMin){
    await dbSet(col, itemId, {alarmNextThresholdMin: thresholdMin + repeatMin, alarmFired:false});
  } else {
    await dbSet(col, itemId, {alarmFired:true});
  }
  S.activeAlarm = {kind, itemId, minutes:thresholdMin, repeating: !!repeatMin};
  playAlarmBeep();

async function dbAdd(col, data){
  if(S.dataBackend==='supabase') return dbAddSupabase(col, data);
  const withMeta = {...data, createdAt: Date.now()};
  const tempId = uid(col);
  // Optimistic UI: show the new record immediately, regardless of how long the
  // backend write + snapshot round-trip takes.
  if(!S[col]) S[col] = [];
  S[col].unshift({id:tempId, ...withMeta, _optimistic:true});
  render();
  if(S.dbAvailable){
    // Guard against the SAME class of race fixed in dbSet, but for creates: an
    // unrelated onSnapshot for this collection (triggered by some other write)
    // can fire while our add() is still in flight and wholesale-replace S[col]
    // from server data that doesn't include our not-yet-committed temp record
    // yet — making the just-created item flicker out of every screen until our
    // own write finishes. Keeping it in _pendingAdds lets subscribeAll() keep
    // showing it through any such in-between snapshot.
    S._pendingAdds[col] = S._pendingAdds[col] || {};
    S._pendingAdds[col][tempId] = {id:tempId, ...withMeta, _optimistic:true};
    try{
      const ref = await S.db.collection(col).add(withMeta);
      // A resolved add() promise is NOT proof the record is actually readable
      // by the rest of the app — read it back before declaring success, so
      // the success toast is never shown for a write that didn't really land.
      const check = await ref.get();
      if(!check || !check.exists){
        throw new Error('write did not verify as readable after add()');
      }
      // Promote the temp entry to the real, server-confirmed record right away
      // — don't wait on the next onSnapshot round-trip for it to reappear.
      // The add() call above can itself trigger an onSnapshot (the backend
      // notifying of the new doc) before we get here, and that snapshot's
      // merge in subscribeAll() will have already inserted the real record
      // alongside our still-registered temp one — so promotion has to be
      // idempotent: if the real id is already present, just drop the temp
      // duplicate instead of blindly overwriting by index.
      delete S._pendingAdds[col][tempId];
      const idx = S[col].findIndex(x=>x.id===tempId);
      const alreadyHasReal = S[col].some(x=>x.id===ref.id);
      if(alreadyHasReal){
        if(idx>=0) S[col].splice(idx,1);
      } else if(idx>=0){
        S[col][idx] = {id:ref.id, ...withMeta};
      } else {
        S[col].unshift({id:ref.id, ...withMeta});
      }
      render();
      return ref.id;
    }catch(e){
      // roll back the optimistic entry and surface the failure
      if(S._pendingAdds[col]) delete S._pendingAdds[col][tempId];
      S[col] = S[col].filter(x=>x.id!==tempId);
      render();
      toast('Não foi possível confirmar o salvamento — verifique sua conexão e tente novamente.');
      throw e;
    }
  } else {
    return tempId;
  }
}
async function dbAddSupabase(col, data){
  // Mesmo espírito do caminho Claude acima: atualização otimista primeiro,
  // confirmação depois, com rollback se der errado.
  const client = getSupabaseClient();
  const tempId = uid(col);
  if(!S[col]) S[col] = [];
  S[col].unshift({id:tempId, ...data, createdAt: Date.now(), _optimistic:true});
  render();
  if(!client){
    toast('Supabase não está configurado (SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY em branco).');
    S[col] = S[col].filter(x=>x.id!==tempId);
    render();
    throw new Error('Supabase client not configured');
  }
  const ownerId = await getCurrentOwnerId();
  const row = { ...toSupabaseRow(col, data), owner_id: ownerId };
  try{
    const { data: inserted, error } = await client.from(col).insert(row).select().single();
    if(error) throw error;
    const confirmed = fromSupabaseRow(col, inserted);
    const idx = S[col].findIndex(x=>x.id===tempId);
    if(idx>=0) S[col][idx] = confirmed; else S[col].unshift(confirmed);
    render();
    return confirmed.id;
  }catch(e){
    S[col] = S[col].filter(x=>x.id!==tempId);
    render();
    console.error('[Supabase] Falha ao inserir:', e);
    toast(e && e.message ? `Não foi possível salvar: ${e.message}` : 'Não foi possível salvar no Supabase — verifique sua conexão.');
    throw e;
  }
}
async function dbSet(col, id, data, opts){
  if(S.dataBackend==='supabase') return dbSetSupabase(col, id, data, opts);
  // Optimistic UI: patch local state and render immediately; the real write
  // happens in parallel and the eventual onSnapshot reconciles server truth.
  if(!S[col]) S[col] = [];
  const idx = S[col].findIndex(x=>x.id===id);
  if(idx>=0) S[col][idx] = {...S[col][idx], ...data};
  else S[col].unshift({id, ...data});
  render();
  if(S.dbAvailable){
    // Remember exactly what we just applied locally, keyed per document AND per
    // field, so that if an onSnapshot event that was already "in flight" before
    // this write arrives AFTER we've applied it (but before the server confirms),
    // it can't silently revert the field(s) the user just changed. This is what
    // makes S[col] a genuine single source of truth instead of racing with the
    // backend — see the guard in subscribeAll().
    //
    // Fields are reference-counted (not just deleted on "my" confirm) because two
    // overlapping writes can touch the same field before either confirms — e.g.
    // clicking a priority pill twice quickly. If write A confirms first, we must
    // NOT drop the guard on that field while write B (still in flight, holding a
    // newer value) is unconfirmed — the count only reaches zero once every write
    // that touched the field has confirmed, and the stored value is always the
    // most recently dispatched one (later dispatches overwrite it below).
    const key = col+':'+id;
    S._pendingWrites[key] = {...(S._pendingWrites[key]||{}), ...data};
    S._pendingWriteCounts[key] = S._pendingWriteCounts[key] || {};
    for(const k of Object.keys(data)) S._pendingWriteCounts[key][k] = (S._pendingWriteCounts[key][k]||0) + 1;
    try{
      // `update` merges into an existing document (and correctly leaves fields we
      // didn't touch, like createdAt, intact) — `set` would replace the WHOLE
      // document and silently wipe everything not included in `data`.
      // The one exception is upsert-style writes (e.g. notification read-state)
      // where the document may not exist yet, so a full `set` (create-or-replace)
      // is what we actually want.
      if(opts && opts.upsert){
        await S.db.collection(col).doc(id).set(data);
      } else {
        await S.db.collection(col).doc(id).update(data);
      }
      // The server confirmed OUR write. Only stop guarding a field once EVERY
      // write that touched it has confirmed (count reaches zero) — not just
      // this one — so a still-pending overlapping write stays protected.
      for(const k of Object.keys(data)){
        const counts = S._pendingWriteCounts[key];
        if(!counts) continue;
        counts[k] = (counts[k]||1) - 1;
        if(counts[k] <= 0){
          delete counts[k];
          if(S._pendingWrites[key]) delete S._pendingWrites[key][k];
        }
      }
      if(S._pendingWrites[key] && Object.keys(S._pendingWrites[key]).length===0) delete S._pendingWrites[key];
      if(S._pendingWriteCounts[key] && Object.keys(S._pendingWriteCounts[key]).length===0) delete S._pendingWriteCounts[key];
    }catch(e){
      for(const k of Object.keys(data)){
        const counts = S._pendingWriteCounts[key];
        if(!counts) continue;
        counts[k] = (counts[k]||1) - 1;
        if(counts[k] <= 0){
          delete counts[k];
          if(S._pendingWrites[key]) delete S._pendingWrites[key][k];
        }
      }
      toast('Não foi possível salvar a alteração — verifique sua conexão.');
      throw e;
    }
  }
}
async function dbSetSupabase(col, id, data, opts){
  // Mesma filosofia otimista do caminho Claude.
  if(!S[col]) S[col] = [];
  const idx = S[col].findIndex(x=>x.id===id);
  const before = idx>=0? {...S[col][idx]} : null;
  if(idx>=0) S[col][idx] = {...S[col][idx], ...data};
  else S[col].unshift({id, ...data});
  render();

  const client = getSupabaseClient();
  if(!client){
    toast('Supabase não está configurado (SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY em branco).');
    if(idx>=0 && before){ S[col][idx] = before; } else { S[col] = S[col].filter(x=>x.id!==id); }
    render();
    throw new Error('Supabase client not configured');
  }
  const ownerId = await getCurrentOwnerId();
  // owner_id NUNCA entra no payload de UPDATE — só é usado como filtro, para
  // garantir que a escrita só alcança um registro que já é do mesmo dono.
  const row = toSupabaseRow(col, data);
  try{
    if(opts && opts.upsert){
      // notif_reads / app_meta: o "id" é escolhido pelo próprio app (não é
      // gerado pelo banco), então "cria se não existir, senão atualiza".
      const { data: upserted, error } = await client.from(col)
        .upsert({ id, ...row, owner_id: ownerId }, { onConflict:'id' })
        .select().single();
      if(error) throw error;
      const confirmed = fromSupabaseRow(col, upserted);
      const idx2 = S[col].findIndex(x=>x.id===id);
      if(idx2>=0) S[col][idx2] = confirmed; else S[col].unshift(confirmed);
      render();
      return;
    }
    const { data: updated, error } = await client.from(col)
      .update(row)
      .eq('id', id)
      .eq('owner_id', ownerId) // nunca deixa uma escrita alcançar registro de outro dono
      .select().single();
    if(error) throw error;
    if(!updated){
      throw new Error('update não encontrou um registro correspondente (id + owner_id)');
    }
    const confirmed = fromSupabaseRow(col, updated);
    const idx2 = S[col].findIndex(x=>x.id===id);
    if(idx2>=0) S[col][idx2] = confirmed;
    render();
  }catch(e){
    // Desfaz exatamente o que a parte otimista fez: se o registro já existia
    // localmente, devolve o valor de antes; se ele NÃO existia (ex: uma
    // atualização que nem deveria ter alcançado esse id, como um registro de
    // outro owner que nunca chegou a ser carregado), remove o "fantasma"
    // otimista em vez de deixá-lo órfão em S[col].
    if(idx>=0 && before){
      const idx3 = S[col].findIndex(x=>x.id===id);
      if(idx3>=0) S[col][idx3] = before;
    } else {
      S[col] = S[col].filter(x=>x.id!==id);
    }
    render();
    console.error('[Supabase] Falha ao atualizar:', e);
    toast(e && e.message ? `Não foi possível salvar a alteração: ${e.message}` : 'Não foi possível salvar a alteração no Supabase — verifique sua conexão.');
    throw e;
  }
}
async function dbDelete(col, id){
  if(S.dataBackend==='supabase') return dbDeleteSupabase(col, id);
  // Optimistic UI: remove immediately, roll back on failure.
  const removed = S[col].find(x=>x.id===id);
  S[col] = S[col].filter(x=>x.id!==id);
  render();
  if(S.dbAvailable){
    const key = col+':'+id;
    S._pendingDeletes[key] = true;
    try{
      await S.db.collection(col).doc(id).delete();
      delete S._pendingDeletes[key];
    }catch(e){
      delete S._pendingDeletes[key];
      if(removed){ S[col].unshift(removed); render(); }
      toast('Não foi possível excluir — verifique sua conexão.');
      throw e;
    }
  }
}
async function dbDeleteSupabase(col, id){
  const removed = S[col].find(x=>x.id===id);
  S[col] = S[col].filter(x=>x.id!==id);
  render();
  const client = getSupabaseClient();
  if(!client){
    toast('Supabase não está configurado (SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY em branco).');
    if(removed){ S[col].unshift(removed); render(); }
    throw new Error('Supabase client not configured');
  }
  const ownerId = await getCurrentOwnerId();
  try{
    // Só apaga quando id E owner_id batem — nunca alcança registro de outro dono.
    const { error, count } = await client.from(col)
      .delete({ count: 'exact' })
      .eq('id', id)
      .eq('owner_id', ownerId);
    if(error) throw error;
    if(!count){
      throw new Error('delete não encontrou um registro correspondente (id + owner_id)');
    }
  }catch(e){
    if(removed){ S[col].unshift(removed); render(); }
    console.error('[Supabase] Falha ao excluir:', e);
    toast(e && e.message ? `Não foi possível excluir: ${e.message}` : 'Não foi possível excluir no Supabase — verifique sua conexão.');
    throw e;
  }
}

/* ---------------- Router / render shell ---------------- */
function setView(v){ S.view = v; S.drawer=null; render(); window.scrollTo(0,0); }
function openProjectWorkspace(projectId){
  S.currentProjectId = projectId;
  S.projectWorkspaceTab = 'visao-geral';
  S.projectQuickMenuOpen = false;
  S.currentStageId = null;
  S.view = 'project_workspace';
  S.drawer = null;
  render();
  window.scrollTo(0,0);
}
function setProjectWorkspaceTab(tab){ S.projectWorkspaceTab = tab; S.projectQuickMenuOpen=false; S.currentStageId=null; rerenderCurrentView(); window.scrollTo(0,0); }
function backToProjects(){ S.view='projetos'; S.currentProjectId=null; render(); window.scrollTo(0,0); }
function toggleProjectQuickMenu(){ S.projectQuickMenuOpen = !S.projectQuickMenuOpen; rerenderCurrentView(); }
function openStageInline(stageId){
  const stage = S.stages.find(s=>s.id===stageId);
  if(!stage) return;
  S.currentProjectId = stage.projectId;
  S.projectWorkspaceTab = 'etapas';
  S.currentStageId = stageId;
  S.stageSubTab = 'resumo';
  S.view = 'project_workspace';
  S.drawer = null;
  render();
  window.scrollTo(0,0);
}
function backToStagesList(){ S.currentStageId = null; rerenderCurrentView(); window.scrollTo(0,0); }
function setStageSubTab(tab){ S.stageSubTab = tab; rerenderCurrentView(); window.scrollTo(0,0); }
function goToAdjacentStage(direction){
  const cur = S.stages.find(s=>s.id===S.currentStageId);
  if(!cur) return;
  const siblings = S.stages.filter(s=>s.projectId===cur.projectId).sort((a,b)=>a.order-b.order);
  const idx = siblings.findIndex(s=>s.id===cur.id);
  const target = siblings[idx+direction];
  if(target){ S.currentStageId = target.id; S.stageSubTab = 'resumo'; rerenderCurrentView(); window.scrollTo(0,0); }
}

function handleGlobalSearch(q){
  const dropdown = document.getElementById('searchDropdown');
  if(!dropdown) return;
  const query = (q||'').trim().toLowerCase();
  if(!query){ dropdown.classList.remove('open'); dropdown.innerHTML=''; return; }
  const results = [];
  S.clients.filter(c=>c.name.toLowerCase().includes(query)).slice(0,4).forEach(c=>results.push({group:'Clientes', label:c.name, sub:c.email||c.phone||'', type:'client', id:c.id}));
  S.projects.filter(p=>p.name.toLowerCase().includes(query)).slice(0,4).forEach(p=>results.push({group:'Projetos', label:p.name, sub:clientName(p.clientId), type:'project', id:p.id}));
  S.tasks.filter(t=>t.title.toLowerCase().includes(query)).slice(0,4).forEach(t=>results.push({group:'Tarefas', label:t.title, sub:projectName(t.projectId), type:'task', id:t.id}));
  S.leads.filter(l=>l.name.toLowerCase().includes(query)).slice(0,3).forEach(l=>results.push({group:'Leads', label:l.name, sub:l.projectType||'', type:'lead', id:l.id}));
  S.suppliers.filter(s=>s.company.toLowerCase().includes(query)).slice(0,3).forEach(s=>results.push({group:'Fornecedores', label:s.company, sub:s.category||'', type:'supplier', id:s.id}));
  S.sites.filter(s=>s.name.toLowerCase().includes(query)).slice(0,3).forEach(s=>results.push({group:'Obras', label:s.name, sub:clientName(s.clientId), type:'site', id:s.id}));
  S.files.filter(f=>f.name.toLowerCase().includes(query)).slice(0,3).forEach(f=>results.push({group:'Arquivos', label:f.name, sub:f.category||'', type:'file', id:f.id}));

  if(!results.length){
    dropdown.innerHTML = `<div class="search-empty">Nenhum resultado para "${escapeHtml(q)}"</div>`;
  } else {
    const groups = {};
    results.forEach(r=>{ (groups[r.group]=groups[r.group]||[]).push(r); });
    dropdown.innerHTML = Object.entries(groups).map(([g,items])=>`
      <div class="search-group-label">${g.toUpperCase()}</div>
      ${items.map(r=>`<div class="search-result" data-act="handleSearchResultClick" data-args='${JSON.stringify([r.type, r.id])}'><span>${escapeHtml(r.label)}</span><span class="sub">${escapeHtml(r.sub)}</span></div>`).join('')}
    `).join('');
  }
  dropdown.classList.add('open');
}

  if(dropdown){ dropdown.classList.remove('open'); dropdown.innerHTML=''; }
  const input = document.getElementById('globalSearchInput');

  if(type==='file'){ setView('arquivos'); return; }
  if(type==='project'){ openProjectWorkspace(id); return; }

}

const PRIORITY_TIER_ORDER = {baixa:1, media:2, alta:3};

const SORT_CONFIGS = {

  ],
};
function getSortState(page){
  if(!S.sortState[page]) S.sortState[page] = {by: SORT_CONFIGS[page][0].key, dir:'asc'};
  return S.sortState[page];
}
function setSortBy(page, key){ getSortState(page).by = key; rerenderCurrentView(); }
function toggleSortDir(page){ const s = getSortState(page); s.dir = s.dir==='asc'?'desc':'asc'; rerenderCurrentView(); }
function applySorting(page, items){
  const config = SORT_CONFIGS[page]; if(!config || !config.length) return items;
  const state = getSortState(page);
  const field = config.find(c=>c.key===state.by) || config[0];
  const sorted = items.slice().sort((a,b)=>{
    const va = field.get(a), vb = field.get(b);
    if(va<vb) return -1; if(va>vb) return 1; return 0;
  });
  if(state.dir==='desc') sorted.reverse();
  return sorted;
}
function renderSortControl(page){
  const config = SORT_CONFIGS[page]; if(!config || !config.length) return '';
  const state = getSortState(page);
  return `<div class="sort-control">
    <span class="mini-tag">Ordenar por:</span>
    <select class="filter-select" data-change-act="setSortBy" data-args='${JSON.stringify([page])}'>
      ${config.map(c=>`<option value="${c.key}" ${state.by===c.key?'selected':''}>${c.label}</option>`).join('')}
    </select>
    <button class="btn btn-sm btn-ghost" title="${state.dir==='asc'?'Crescente':'Decrescente'}" data-act="toggleSortDir" data-args='${JSON.stringify([page])}'>${state.dir==='asc'?'↑':'↓'}</button>
  </div>`;
}

function manualPriorityTier(priority){
  // Defensive normalization only (e.g. malformed/legacy data) — every form,
  // filter and seed record in the app writes 'alta' | 'media' | 'baixa' directly.
  if(priority==='alta') return 'alta';
  if(priority==='baixa') return 'baixa';
  return 'media';
}
function effectivePriorityTier(t){
  const manual = manualPriorityTier(t.priority);
  if(t.status==='concluido' || !t.dueDate) return manual;
  const d = daysUntil(t.dueDate);
  let deadlineTier = null;
  if(d<0) deadlineTier = 'alta';
  else if(d===0) deadlineTier = 'media';
  if(!deadlineTier) return manual;
  return PRIORITY_TIER_ORDER[deadlineTier] > PRIORITY_TIER_ORDER[manual] ? deadlineTier : manual;
}
function taskContextLabel(t){
  if(t.projectId) return projectName(t.projectId);
  if(t.siteId) return siteName(t.siteId);
  if(t.leadId){ const l = S.leads.find(x=>x.id===t.leadId); return l? 'Lead: '+l.name : 'Lead'; }
  return 'Tarefa geral';
}

    if(!items.length) return '';

    return `<div class="section-block card" style="margin-bottom:10px;">
      <div class="card-pad" style="padding-bottom:10px;"><h3 class="section-title">${t.dot} Prioridade ${t.label} — ${items.length}</h3></div>

  const anyPending = tiered.alta.length || tiered.media.length || tiered.baixa.length;

  return `
    <div class="page-head">

function timeAgo(ts){
  if(!ts) return '';
  const diff = Date.now()-ts;
  const m = Math.floor(diff/60000);
  if(m<1) return 'agora há pouco';
  if(m<60) return `há ${m} min`;
  const h = Math.floor(m/60);
  if(h<24) return `há ${h}h`;
  const d = Math.floor(h/24);
  return `há ${d}d`;
}

}

function handleLeadDrop(stage){
  if(!dragLeadId) return;
  dbSet('leads', dragLeadId, {stage});
  const l = S.leads.find(x=>x.id===dragLeadId);
  const st = S.lead_stages.find(s=>s.id===stage);
  if(l) logActivity(`Lead "${l.name}" movido para ${st? st.name : ''}.`, 'lead');
  dragLeadId = null;
}

  dragLeadId = id;
  if(el) el.classList.add('dragging');

function renderWsSchedule(p){
  const stages = S.stages.filter(s=>s.projectId===p.id && s.startDate && s.dueDate).sort((a,b)=>a.order-b.order);
  if(!stages.length) return `<div class="card"><div class="empty" style="padding:50px 20px;">${ICONS.chart}<div class="empty-title">Sem datas suficientes</div><p>Defina início e prazo das etapas para ver o cronograma.</p></div></div>`;
  const dates = stages.flatMap(s=>[s.startDate,s.dueDate]).map(d=>new Date(d+'T12:00:00'));
  const minD = new Date(Math.min(...dates)); minD.setDate(1);
  const maxD = new Date(Math.max(...dates));
  const months = []; let cur = new Date(minD);
  while(cur<=maxD){ months.push(new Date(cur)); cur.setMonth(cur.getMonth()+1); }
  const totalDays = Math.max(1, Math.round((new Date(months[months.length-1].getFullYear(), months[months.length-1].getMonth()+1,1) - minD)/86400000));
  function pct(d){ return Math.max(0, Math.min(100, ((new Date(d+'T12:00:00')-minD)/86400000)/totalDays*100)); }
  return `<div class="card card-pad">
    <div class="gantt-wrap"><div class="gantt">
      <div class="gantt-header"><div></div><div class="gantt-months">${months.map(m=>`<div class="gantt-month">${m.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.','')}</div>`).join('')}</div></div>
      ${stages.map(s=>{

const TASK_STATUS = {
  a_fazer:{label:'A fazer', cls:'b-neutral'},
  em_andamento:{label:'Em andamento', cls:'b-info'},
  aguardando:{label:'Aguardando', cls:'b-warning'},
  concluido:{label:'Concluído', cls:'b-success'},
};
function setTaskViewMode(mode){ S.taskViewMode = mode; rerenderCurrentView(); }
function taskPriorityPill(t){
  const tier = effectivePriorityTier(t);
  return `<span class="pill priority-${tier}">${PRIORITY_TIERS[tier].dot} ${PRIORITY_TIERS[tier].label}</span>`;
}
function renderTarefas(){
  let list = taskLikeItems();
  const qf = S._taskQuickFilter;
  if(qf==='today') list = list.filter(t=>t.status!=='concluido' && t.dueDate===todayISO());
  if(qf==='late') list = list.filter(t=>t.status!=='concluido' && t.dueDate && daysUntil(t.dueDate)<0);
  if(qf==='week') list = list.filter(t=>{ if(t.status==='concluido'||!t.dueDate) return false; const d=daysUntil(t.dueDate); return d!==null && d>=0 && d<=7; });
  if(S.taskFilters.status){
    list = list.filter(t=> t.rawStatus===S.taskFilters.status);
  }
  if(S.taskFilters.priority) list = list.filter(t=> effectivePriorityTier(t)===S.taskFilters.priority);
  if(S.taskFilters.project) list = list.filter(t=> t.projectId===S.taskFilters.project);
  if(S.taskFilters.dueRange==='today') list = list.filter(t=> t.dueDate===todayISO());
  if(S.taskFilters.dueRange==='week') list = list.filter(t=>{ if(!t.dueDate) return false; const d=daysUntil(t.dueDate); return d!==null && d>=0 && d<=7; });
  if(S.taskFilters.dueRange==='none') list = list.filter(t=> !t.dueDate);
  if(S.taskFilters.query){
    const q = S.taskFilters.query.toLowerCase();
    list = list.filter(t=>{
      const haystack = [
        t.title, t.description, t.responsible,
        projectName(t.projectId), clientName(t.clientId||(S.projects.find(p=>p.id===t.projectId)||{}).clientId),
        t.stageId? stageName(t.stageId) : '',
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }
  // Tarefas concluídas NUNCA são apagadas — continuam no banco, só ficam
  // separadas visualmente numa seção própria, recolhida por padrão, em vez
  // de aparecer misturada com as pendentes. Se a pessoa filtrar por status
  // "Concluído" explicitamente, respeitamos essa escolha e não duplicamos.
  const statusFilterIsCompleted = S.taskFilters.status==='concluido';
  let completedList = [];
  if(!statusFilterIsCompleted){
    completedList = applySorting('tarefas', list.filter(t=>t.rawStatus==='concluido'));
    list = list.filter(t=>t.rawStatus!=='concluido');
  }
  list = applySorting('tarefas', list);

  const viewMode = S.taskViewMode;

  return `
    <div class="page-head">
      <div><div class="page-eyebrow">Projetos</div><h1 class="page-title serif">Tarefas</h1><p class="page-sub">${qf? 'Filtro rápido aplicado a partir do dashboard.' : 'Todas as tarefas reais do sistema, num só lugar.'}</p></div>
      <div class="page-actions"><button class="btn btn-primary" data-act="openTaskForm">${ICONS.plus} Nova tarefa</button></div>
    </div>
    <div class="toolbar">
      <input class="filter-input" placeholder="🔍 Buscar por tarefa, projeto, cliente, etapa ou responsável..." value="${escapeHtml(S.taskFilters.query)}" data-input-act="setTaskQuery" style="min-width:260px;">
      <select class="filter-select" data-change-act="setTaskStatusFilter">
        <option value="">Todos os status</option>
        ${Object.entries(TASK_STATUS).map(([k,v])=>`<option value="${k}" ${S.taskFilters.status===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
      <select class="filter-select" data-change-act="setTaskPriorityFilter">
        <option value="">Todas as prioridades</option>
        ${PRIORITY_OPTIONS.map(p=>`<option value="${p.key}" ${S.taskFilters.priority===p.key?'selected':''}>${p.label}</option>`).join('')}
      </select>
      <select class="filter-select" data-change-act="setTaskProjectFilter">
        <option value="">Todos os projetos</option>
        ${S.projects.map(p=>`<option value="${p.id}" ${S.taskFilters.project===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
      </select>
      <select class="filter-select" data-change-act="setTaskDueRangeFilter">
        <option value="">Todos os prazos</option>
        <option value="today" ${S.taskFilters.dueRange==='today'?'selected':''}>Hoje</option>
        <option value="week" ${S.taskFilters.dueRange==='week'?'selected':''}>Esta semana</option>
        <option value="none" ${S.taskFilters.dueRange==='none'?'selected':''}>Sem prazo</option>
      </select>
      ${qf? `<button class="btn btn-sm btn-ghost" data-act="clearTaskQuickFilter">Limpar filtro rápido ${ICONS.x}</button>` : ''}
      <span class="mini-tag" style="margin-left:auto;">${list.length} item${list.length===1?'':'s'}</span>
    </div>
    <div class="toolbar" style="padding-top:0;border-top:none;">
      <div class="view-toggle">
        <button class="view-toggle-btn ${viewMode==='list'?'active':''}" data-act="setTaskViewMode" data-args='${JSON.stringify(['list'])}'>☷ Lista</button>
        <button class="view-toggle-btn ${viewMode==='kanban'?'active':''}" data-act="setTaskViewMode" data-args='${JSON.stringify(['kanban'])}'>▦ Kanban</button>
      </div>
      ${viewMode==='list'? renderSortControl('tarefas') : ''}
    </div>
    ${viewMode==='kanban'? renderTarefasKanban(list) : renderTarefasList(list)}
    ${(viewMode==='list' && !statusFilterIsCompleted)? renderCompletedTasksSection(completedList) : ''}
  `;
}

}

/* ================= CRONOGRAMAS (Gantt) ================= */
function renderCronogramas(){
  const active = applySorting('cronogramas', S.projects.filter(p=>p.status!=='concluido'));
  if(!active.length) return `<div class="page-head"><div><div class="page-eyebrow">Projetos</div><h1 class="page-title serif">Cronogramas</h1></div></div><div class="card"><div class="empty" style="padding:60px 20px;">${ICONS.chart}<div class="empty-title">Nenhum projeto ativo</div><p>Cronogramas aparecem aqui a partir dos prazos de início e entrega dos projetos.</p></div></div>`;

  const dates = active.flatMap(p=>[p.startDate,p.dueDate]).filter(Boolean).map(d=>new Date(d+'T12:00:00'));
  const minD = new Date(Math.min(...dates)); const maxD = new Date(Math.max(...dates));
  minD.setDate(1);
  const months = [];
  let cur = new Date(minD);
  while(cur<=maxD){ months.push(new Date(cur)); cur.setMonth(cur.getMonth()+1); }
  const totalDays = Math.max(1, Math.round((new Date(months[months.length-1].getFullYear(), months[months.length-1].getMonth()+1,1) - minD)/86400000));

  function pct(dateStr){ const d = new Date(dateStr+'T12:00:00'); return Math.max(0, Math.min(100, ((d-minD)/86400000)/totalDays*100)); }

  return `
    <div class="page-head"><div><div class="page-eyebrow">Projetos</div><h1 class="page-title serif">Cronogramas</h1><p class="page-sub">Linha do tempo dos projetos ativos, do início à entrega.</p></div></div>
    <div class="toolbar" style="border-top:none;padding-top:0;">${renderSortControl('cronogramas')}</div>
    <div class="card card-pad">
      <div class="gantt-wrap"><div class="gantt">
        <div class="gantt-header"><div></div><div class="gantt-months">${months.map(m=>`<div class="gantt-month">${m.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.','')}</div>`).join('')}</div></div>
        ${active.map(p=>{
          const start = p.startDate || minD.toISOString().slice(0,10);
          const end = p.dueDate || start;
          const left = pct(start); const right = pct(end);
          const width = Math.max(1.5, right-left);
          const late = p.status==='atrasado'; const soon = p.status==='proximo_entrega';
          return `<div class="gantt-row">
            <div class="gantt-row-label" style="cursor:pointer;" data-act="openProjectWorkspace" data-args='${JSON.stringify([p.id])}'>${escapeHtml(p.name)}<div class="sub">${escapeHtml(clientName(p.clientId))}</div></div>
            <div class="gantt-track"><div class="gantt-bar ${late?'late':soon?'soon':''}" style="left:${left}%;width:${width}%;" data-act="openProjectWorkspace" data-args='${JSON.stringify([p.id])}' title="${escapeHtml(p.name)}: ${fmtDate(start)} — ${fmtDate(end)}"><span>${p.progress||0}%</span></div></div>
          </div>`;
        }).join('')}
      </div></div>
    </div>
    <p class="mini-tag" style="margin-top:10px;">Barras coloridas por status — vermelho: atrasado · amarelo: próximo da entrega · verde-acinzentado: no prazo. Clique no nome do projeto ou na barra para abrir o projeto.</p>

    <div class="section-block card">
      <div class="card-pad" style="padding-bottom:0;"><h3 class="section-title">Etapas por projeto</h3><p class="mini-tag" style="margin:2px 0 0;">Clique numa etapa para abrir direto na subpágina dela.</p></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Projeto</th><th>Etapa</th><th>Prazo</th><th>Status</th></tr></thead>
        <tbody>
          ${active.flatMap(p=>{
            const stages = S.stages.filter(s=>s.projectId===p.id).sort((a,b)=>a.order-b.order);
            const relevant = stages.filter(s=>s.status!=='concluido').slice(0,1).concat(stages.filter(s=>s.status==='em_andamento'));
            const shown = relevant.length? [...new Map(relevant.map(s=>[s.id,s])).values()] : stages.slice(0,1);
            return shown.map(s=>({p,s}));
          }).map(({p,s})=>{
            const late = s.dueDate && s.status!=='concluido' && daysUntil(s.dueDate)<0;

/* ================= FINANCEIRO ================= */
const RECEITA_STATUS = {previsto:{label:'Previsto',cls:'b-neutral'}, pendente:{label:'Pendente',cls:'b-warning'}, recebido:{label:'Recebido',cls:'b-success'}, atrasado:{label:'Atrasado',cls:'b-danger'}};
const DESPESA_STATUS = {previsto:{label:'Previsto',cls:'b-neutral'}, pendente:{label:'Pendente',cls:'b-warning'}, pago:{label:'Pago',cls:'b-success'}, atrasado:{label:'Atrasado',cls:'b-danger'}};
const EXPENSE_CATEGORIES = ['Marcenaria','Marmoraria','Iluminação','Revestimentos','Elétrica','Hidráulica','Pintura','Móveis','Estrutura','Outros'];
function effectiveTxnStatus(t){
  const doneVal = t.type==='receita' ? 'recebido' : 'pago';
  if(t.status===doneVal) return doneVal;
  if(t.dueDate && daysUntil(t.dueDate)<0) return 'atrasado';
  return t.status||'previsto';
}
function txnStatusMap(t){ return t.type==='receita'? RECEITA_STATUS : DESPESA_STATUS; }
function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function monthLabel(key){ const [y,m]=key.split('-'); const d = new Date(Number(y), Number(m)-1, 1); return d.toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}).replace('.',''); }

function financialSummaryCurrentMonth(){
  const mk = todayISO().slice(0,7);
  const receitas = S.transactions.filter(t=>t.type==='receita' && monthKey(t.dueDate)===mk);
  const despesas = S.transactions.filter(t=>t.type==='despesa' && monthKey(t.dueDate)===mk);
  const rSum = receitas.reduce((s,t)=>s+(Number(t.value)||0),0);
  const dSum = despesas.reduce((s,t)=>s+(Number(t.value)||0),0);
  return {rSum, dSum, resultado:rSum-dSum, receitas, despesas};
}

  const pagoHist = S.transactions.filter(t=>t.type==='despesa' && t.status==='pago').reduce((s,t)=>s+(Number(t.value)||0),0);
  const atrasadosReceber = aReceber.filter(t=>effectiveTxnStatus(t)==='atrasado');

  return `
    <div class="page-head">
      <div><div class="page-eyebrow">Financeiro</div><h1 class="page-title serif">Visão geral</h1><p class="page-sub">${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})} — resumo financeiro do escritório.</p></div>
      <div class="page-actions"><button class="btn" data-act="openTxnForm" data-args='${JSON.stringify(['despesa'])}'>${ICONS.plus} Nova despesa</button><button class="btn btn-primary" data-act="openTxnForm" data-args='${JSON.stringify(['receita'])}'>${ICONS.plus} Nova receita</button></div>

        <div class="stat-top"><span class="stat-label">RECEITAS DO MÊS</span><div class="stat-icon" style="background:var(--success-soft);color:var(--success);">${ICONS.chart}</div></div>

        <div class="stat-top"><span class="stat-label">DESPESAS DO MÊS</span><div class="stat-icon" style="background:var(--danger-soft);color:var(--danger);">${ICONS.truck}</div></div>

      <div class="card card-pad"><div class="stat-label">PAGO (HISTÓRICO)</div><div class="stat-value" style="font-size:22px;margin-top:6px;">${fmtMoney(pagoHist)}</div></div>
    </div>

function renderCashflowChart(monthsBack, monthsFwd){
  const today = new Date();
  const keys = [];
  for(let i=-monthsBack;i<=monthsFwd;i++){
    const d = new Date(today.getFullYear(), today.getMonth()+i, 1);
    keys.push(d.toISOString().slice(0,7));
  }
  const data = keys.map(k=>{
    const receitas = S.transactions.filter(t=>t.type==='receita' && monthKey(t.dueDate)===k).reduce((s,t)=>s+(Number(t.value)||0),0);
    const despesas = S.transactions.filter(t=>t.type==='despesa' && monthKey(t.dueDate)===k).reduce((s,t)=>s+(Number(t.value)||0),0);
    return {k, receitas, despesas};
  });
  const max = Math.max(1, ...data.map(d=>Math.max(d.receitas,d.despesas)));
  return `
    <div class="cf-chart">
      ${data.map(d=>`
        <div class="cf-col">
          <div class="cf-bars">
            <div class="cf-bar receita" style="height:${Math.max(2,d.receitas/max*180)}px;" title="Receitas ${monthLabel(d.k)}: ${fmtMoney(d.receitas)}"></div>
            <div class="cf-bar despesa" style="height:${Math.max(2,d.despesas/max*180)}px;" title="Despesas ${monthLabel(d.k)}: ${fmtMoney(d.despesas)}"></div>
          </div>
          <div class="cf-label">${monthLabel(d.k)}</div>
        </div>
      `).join('')}
    </div>
    <div class="cf-legend"><span><span class="sw" style="background:var(--success);"></span>Receitas</span><span><span class="sw" style="background:var(--danger);"></span>Despesas</span></div>
  `;
